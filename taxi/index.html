<title>Жолдош Такси</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed map; a bottom sheet on phones, a floating left panel from 900px. One accent (teal), cool grey family. */
:root{
  --bg:oklch(95.6% 0.007 195); --surface:oklch(99.2% 0.003 195); --surface-2:oklch(96% 0.008 195); --line:oklch(90% 0.01 195);
  --fg:oklch(23% 0.02 205); --muted:oklch(48% 0.02 205); --accent:oklch(55% 0.105 186); --accent-strong:oklch(45% 0.09 188); --accent-soft:oklch(93% 0.035 186); --on-accent:oklch(99% 0.004 186);
  --danger:oklch(55% 0.17 25); --warn:oklch(72% 0.13 75);
  --road:oklch(99% 0.002 195); --road-major:oklch(97.5% 0.03 90); --block:oklch(91.5% 0.008 200); --bld:oklch(88.5% 0.01 205); --park:oklch(89% 0.05 150); --water:oklch(84% 0.05 230); --label:oklch(42% 0.02 205); --field:oklch(93.5% 0.012 130);
  --shadow:0 1px 2px oklch(20% 0.02 205 / .08),0 8px 28px oklch(20% 0.02 205 / .12);
  --f:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --r:18px; --z-map:0; --z-ui:10; --z-sheet:20; --z-drawer:40; --z-toast:60;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:oklch(21% 0.014 210); --surface:oklch(25.5% 0.014 210); --surface-2:oklch(29% 0.015 210); --line:oklch(34% 0.015 210);
  --fg:oklch(94% 0.008 200); --muted:oklch(72% 0.015 200); --accent:oklch(68% 0.11 184); --accent-strong:oklch(78% 0.1 184); --accent-soft:oklch(33% 0.05 186); --on-accent:oklch(18% 0.03 190);
  --road:oklch(31% 0.012 210); --road-major:oklch(38% 0.03 85); --block:oklch(24.5% 0.012 210); --bld:oklch(27.5% 0.013 210); --park:oklch(30% 0.045 155); --water:oklch(32% 0.05 235); --label:oklch(76% 0.015 200); --field:oklch(23% 0.016 140);
  --shadow:0 1px 2px oklch(0% 0 0 / .3),0 10px 30px oklch(0% 0 0 / .4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:oklch(21% 0.014 210); --surface:oklch(25.5% 0.014 210); --surface-2:oklch(29% 0.015 210); --line:oklch(34% 0.015 210);
  --fg:oklch(94% 0.008 200); --muted:oklch(72% 0.015 200); --accent:oklch(68% 0.11 184); --accent-strong:oklch(78% 0.1 184); --accent-soft:oklch(33% 0.05 186); --on-accent:oklch(18% 0.03 190);
  --road:oklch(31% 0.012 210); --road-major:oklch(38% 0.03 85); --block:oklch(24.5% 0.012 210); --bld:oklch(27.5% 0.013 210); --park:oklch(30% 0.045 155); --water:oklch(32% 0.05 235); --label:oklch(76% 0.015 200); --field:oklch(23% 0.016 140);
  --shadow:0 1px 2px oklch(0% 0 0 / .3),0 10px 30px oklch(0% 0 0 / .4); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 15px/1.4 var(--f);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0;z-index:var(--z-map);touch-action:none;cursor:grab;display:block;width:100%;height:100%}
#map.dragging{cursor:grabbing}

/* top bar */
.topbar{position:absolute;z-index:var(--z-ui);top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.topbar > *{pointer-events:auto}
.round{width:46px;height:46px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .16s var(--ease-out)}
.round:active{transform:scale(.95)}
.round svg{width:22px;height:22px}
.brand{display:flex;align-items:center;gap:8px;padding:0 14px 0 6px;height:46px;border-radius:23px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;letter-spacing:-.01em}
.brand i{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.brand i svg{width:19px;height:19px}
.lang{display:flex;background:var(--surface);box-shadow:var(--shadow);border-radius:23px;padding:4px;height:46px;align-items:center}
.lang button{height:38px;min-width:42px;border-radius:19px;font-weight:600;font-size:13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.tr{display:flex;gap:8px}

/* map controls */
.mapctl{position:absolute;z-index:var(--z-ui);right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;transition:bottom .3s var(--ease-drawer)}
.mapctl .round{width:44px;height:44px}

/* center pin */
.pin{position:absolute;z-index:var(--z-ui);left:50%;width:0;height:0;pointer-events:none;transition:top .3s var(--ease-drawer)}
.pin .head{position:absolute;left:-17px;top:-58px;width:34px;height:34px;border-radius:50%;background:var(--fg);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .2s var(--ease-out)}
.pin .head b{width:12px;height:12px;border-radius:50%;background:var(--surface)}
.pin .stick{position:absolute;left:-1.5px;top:-26px;width:3px;height:22px;background:var(--fg);border-radius:2px;transition:transform .2s var(--ease-out);transform-origin:bottom}
.pin .shadow{position:absolute;left:-6px;top:-4px;width:12px;height:6px;border-radius:50%;background:oklch(20% 0.02 205 / .28);transition:transform .2s var(--ease-out)}
.pin.lift .head{transform:translateY(-10px)} .pin.lift .stick{transform:translateY(-10px)} .pin.lift .shadow{transform:scale(1.5)}
.pin .tag{position:absolute;left:0;top:-98px;transform:translateX(-50%);white-space:nowrap;background:var(--fg);color:var(--surface);font-size:13px;font-weight:600;padding:7px 12px;border-radius:12px;transition:opacity .15s ease}
.pin.lift .tag{opacity:0}
.pin.dest .head{background:var(--accent)} .pin.dest .stick{background:var(--accent)} .pin.dest .tag{background:var(--accent);color:var(--on-accent)}

/* sheet */
.sheet{position:absolute;z-index:var(--z-sheet);left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -6px 30px oklch(20% 0.02 205 / .14);padding:8px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));max-height:78%;display:flex;flex-direction:column}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px;flex:none}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px;min-height:0;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
@media (min-width:900px){
  .sheet{left:max(20px,env(safe-area-inset-left,0px));right:auto;top:calc(76px + env(safe-area-inset-top,0px));bottom:auto;max-height:calc(100% - 96px);width:400px;border-radius:24px;max-height:none;box-shadow:var(--shadow);padding:16px}
  .grab{display:none}
}
.sheet-enter{animation:sheetIn .32s var(--ease-drawer)}
@keyframes sheetIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

h2{font-size:21px;font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}

/* address block */
.addr{background:var(--surface-2);border-radius:var(--r);display:flex;flex-direction:column}
.addr button{display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left;min-height:56px;width:100%}
.addr button + button{border-top:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:3px solid var(--fg)}
.dot.b{border-color:var(--accent);background:var(--accent)}
.addr .t{display:block;font-size:12px;color:var(--muted)}
.addr .v{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr .v.ph{color:var(--muted);font-weight:500}
.addr .grow{flex:1;min-width:0}
.addr svg{width:18px;height:18px;color:var(--muted);flex:none}
.big-where{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:var(--r);padding:16px;font-size:18px;font-weight:700;width:100%;text-align:left;transition:transform .16s var(--ease-out)}
.big-where:active{transform:scale(.98)}
.big-where svg{width:22px;height:22px;color:var(--accent-strong)}

/* quick chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
@media (min-width:900px){.chips{margin:0;padding:0;flex-wrap:wrap}}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;background:var(--surface-2);font-weight:500;font-size:14px;transition:transform .16s var(--ease-out),background-color .15s ease}
.chip:active{transform:scale(.96)}
.chip svg{width:16px;height:16px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.chip[aria-pressed="true"] svg{color:var(--surface)}

/* services (big buttons, one per service) */
.svcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.svc{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:6px;min-height:118px;padding:12px;border-radius:20px;background:var(--surface-2);text-align:left;overflow:hidden;border:2px solid transparent;transition:transform .16s var(--ease-out),border-color .15s ease,background-color .15s ease}
.svc:active{transform:scale(.97)}
.svc b{font-weight:800;font-size:16px;letter-spacing:-.01em;line-height:1.15}
.svc small{font-size:11.5px;color:var(--muted);line-height:1.25}
.svc .art{align-self:flex-end;color:var(--fg);margin:-4px -6px -6px 0}
.svc .art svg{width:64px;height:48px}
.svc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.svc[aria-pressed="true"] .art{color:var(--accent-strong)}
.svctabs{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--surface-2)}
.svctabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);transition:background-color .15s ease,color .15s ease}
.svctabs button svg{width:26px;height:20px}
.svctabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px oklch(20% 0.02 205 / .12)}
.stepper{display:inline-flex;align-items:center;gap:2px;height:38px;border-radius:19px;background:var(--surface-2);padding:0 4px;font-weight:600;font-size:14px}
.stepper button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.stepper button svg{width:16px;height:16px}
.stepper span{padding:0 6px;font-variant-numeric:tabular-nums}
/* tariffs */
.tariffs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px))}
.tariffs::-webkit-scrollbar{display:none}
@media (min-width:900px){.tariffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;padding:2px}}
.tariffs.few{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));margin:0;padding:2px;overflow:visible}
.tariffs.few .tf{width:auto}
.tf{flex:none;width:112px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 10px 11px;border-radius:16px;background:var(--surface-2);border:2px solid transparent;text-align:left;transition:transform .16s var(--ease-out),border-color .15s ease,background-color .15s ease}
@media (min-width:900px){.tf{width:auto}}
.tf:active{transform:scale(.97)}
.tf[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tf[disabled]{opacity:.45;cursor:not-allowed}
.tf .ic{height:34px;display:flex;align-items:center;color:var(--fg)}
.tf .ic svg{width:40px;height:30px}
.tf .n{font-weight:600;font-size:13.5px;line-height:1.2}
.tf .p{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.tf .e{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.opts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;transition:transform .16s var(--ease-out),background-color .15s ease;flex:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .pr{font-variant-numeric:tabular-nums;opacity:.9;font-weight:600}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--surface-2);color:var(--danger)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* search state */
.progress{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;width:40%;background:var(--accent);border-radius:2px;animation:prog 1.4s linear infinite}
@keyframes prog{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* driver card */
.drv{display:flex;gap:12px;align-items:center}
.ava{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.drv .grow{flex:1;min-width:0}
.drv b{display:block;font-size:17px}
.drv .sub span{color:var(--fg);font-weight:600}
.plate{display:inline-flex;align-items:center;gap:8px;font:700 17px var(--mono);letter-spacing:.04em;padding:6px 10px;border-radius:10px;border:2px solid var(--fg);background:var(--surface);white-space:nowrap}
.plate small{font:700 10px var(--f);background:var(--accent);color:var(--on-accent);padding:2px 4px;border-radius:4px;letter-spacing:.02em}
.eta{display:flex;align-items:baseline;gap:8px}
.eta b{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:10px 0;display:flex;flex-direction:column;gap:2px}
.facts div + div{border-left:1px solid var(--line);padding-left:12px}
.facts span{font-size:12px;color:var(--muted)}
.facts b{font-size:15px;font-variant-numeric:tabular-nums}
.phone{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:var(--surface-2)}
.phone b{display:block;font:600 15px var(--mono);user-select:all}
.phone .sub{display:block}
.linkbtn{color:var(--accent-strong);font-weight:600;font-size:14px;padding:6px 0}

/* rating */
.stars{display:flex;gap:6px;justify-content:center}
.stars button{width:48px;height:48px;display:grid;place-items:center;color:var(--line);transition:transform .16s var(--ease-out),color .12s ease}
.stars button:active{transform:scale(.9)}
.stars button svg{width:38px;height:38px}
.stars button.on{color:var(--warn)}

/* search overlay */
.overlay{position:absolute;inset:0;z-index:var(--z-drawer);background:var(--surface);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-right,0px));animation:fadeUp .24s var(--ease-out)}
@media (min-width:900px){.overlay{left:20px;top:calc(76px + env(safe-area-inset-top,0px));bottom:20px;width:400px;right:auto;border-radius:24px;box-shadow:var(--shadow);padding:16px}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.searchrow{display:flex;gap:8px;align-items:center}
.field{flex:1;display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-radius:16px;background:var(--surface-2)}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;font-weight:500}
.field input::placeholder{color:var(--muted)}
.field svg{width:20px;height:20px;color:var(--muted)}
.list{overflow-y:auto;margin-top:8px;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;text-align:left;border-bottom:1px solid var(--line);width:100%}
.item .ib{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.item .ib svg{width:18px;height:18px;color:var(--muted)}
.item .grow{flex:1;min-width:0}
.item b{display:block;font-weight:600}
.item small{color:var(--muted);font-size:13px}
.item .km{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}

/* drawer */
.scrim{position:absolute;inset:0;z-index:var(--z-drawer);background:oklch(15% 0.02 205 / .35);animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.drawer{position:absolute;z-index:calc(var(--z-drawer) + 1);top:0;bottom:0;left:0;width:min(340px,86%);background:var(--surface);padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:slideIn .28s var(--ease-drawer);overflow-y:auto}
@keyframes slideIn{from{transform:translateX(-100%)}}
.drawer h3{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.trip{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.trip b{font-weight:600}
.trip span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.toast{position:absolute;z-index:var(--z-toast);left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:14px;font-weight:500;font-size:14px;box-shadow:var(--shadow);animation:fadeUp .2s var(--ease-out);max-width:calc(100% - 32px);text-align:center}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<div class="app" id="app">
  <canvas id="map" aria-label="Бишкектин картасы"></canvas>
  <div class="topbar">
    <div class="tr"><button class="round" id="menuBtn" aria-label="Меню"></button><div class="brand"><i id="brandIc"></i><span>Жолдош</span></div></div>
    <div class="lang" role="group" aria-label="Тил"><button data-lang="ky" aria-pressed="true">KG</button><button data-lang="ru" aria-pressed="false">RU</button></div>
  </div>
  <div class="pin" id="pin"><span class="tag" id="pinTag"></span><span class="shadow"></span><span class="stick"></span><span class="head"><b></b></span></div>
  <div class="mapctl" id="mapctl">
    <button class="round" id="zin" aria-label="Чоңойтуу"></button>
    <button class="round" id="zout" aria-label="Кичирейтүү"></button>
    <button class="round" id="locate" aria-label="Мен турган жер"></button>
  </div>
  <section class="sheet" id="sheet" aria-live="polite"><div class="grab"></div><div class="sheet-body" id="body"></div></section>
  <div id="layer"></div>
</div>

<script>
(function(){
"use strict";
// ---------- icons (one stroke family) ----------
const S = (d, extra="") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const IC = {
  menu:S('<path d="M4 7h16M4 12h16M4 17h10"/>'),
  plus:S('<path d="M12 5v14M5 12h14"/>'), minus:S('<path d="M5 12h14"/>'),

  ctx.font=`600 ${z>0.14?13:11}px Onest, system-ui, sans-serif`;
  PARKS.forEach(p=>{ const [sx,sy]=toS((p.x0+p.x1)/2,(p.y0+p.y1)/2); if(z>0.08) halo(ctx,pName(p),sx,sy,1); });
  PLACES.forEach(p=>{ const [sx,sy]=toS(p.x,p.y); if(sx<-100||sx>W+100||sy<-30||sy>H+30) return; ctx.fillStyle=C.fg; ctx.beginPath(); ctx.arc(sx,sy,3.5,0,7); ctx.fill(); if(z>0.1||p.k==="bz"||p.k==="air"){ ctx.textAlign="left"; halo(ctx,pName(p),sx+7,sy,0,C.fg); } });
  ctx.textAlign="left";
  // cars
  drawCars(ctx);
  dirty=false;
}
function halo(ctx,text,x,y,center,color){ ctx.textAlign=center?"center":(ctx.textAlign||"center"); if(!center&&ctx.textAlign!=="left") ctx.textAlign="center"; ctx.lineWidth=3.5; ctx.strokeStyle=C.block; ctx.lineJoin="round"; ctx.strokeText(text,x,y); ctx.fillStyle=color||C.label; ctx.fillText(text,x,y); }
function drawRoute(ctx){
  const pts=route.pts.map(p=>toS(p[0],p[1]));
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle=C.surface; ctx.lineWidth=11; ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();
  ctx.strokeStyle=C.accent; ctx.lineWidth=6; ctx.beginPath();
  const upto = route.drawn ?? 1; let acc=0; const total=route.len;
  for(let i=0;i<pts.length;i++){ if(i===0){ ctx.moveTo(...pts[0]); continue; }
    const seg=dist(route.pts[i-1],route.pts[i]); if((acc+seg)/total<=upto){ ctx.lineTo(...pts[i]); acc+=seg; }
    else { const f=(upto*total-acc)/seg; ctx.lineTo(pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f); break; } }
  ctx.stroke();
  // end markers
  const [ax,ay]=pts[0],[bx,by]=pts[pts.length-1];
  ctx.fillStyle=C.surface; ctx.strokeStyle=C.fg; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(ax,ay,8,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle=C.accent; ctx.beginPath(); ctx.arc(bx,by,9,0,7); ctx.fill(); ctx.fillStyle=C.surface; ctx.beginPath(); ctx.arc(bx,by,3.5,0,7); ctx.fill();
}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

// ---------- cars ----------
const CARS=[];
function spawnCars(){
  CARS.length=0;
  for(let i=0;i<14;i++){
    const onNS=rnd()<.5, s=onNS?NS[Math.floor(rnd()*NS.length)]:EW[Math.floor(rnd()*EW.length)];
    const p=onNS?[s.x,BOUND.y0+rnd()*(BOUND.y1-BOUND.y0)]:[BOUND.x0+rnd()*(BOUND.x1-BOUND.x0),s.y];
    CARS.push({x:p[0],y:p[1],dir:onNS?[0,rnd()<.5?1:-1]:[rnd()<.5?1:-1,0],v:6+rnd()*6});
  }
}
function drawCar(ctx,x,y,ang,mine){
  const [sx,sy]=toS(x,y); if(sx<-20||sx>W+20||sy<-20||sy>H+20) return;
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(ang);
  const L=mine?22:17, Wd=mine?11:9;
  ctx.fillStyle="oklch(20% 0.02 205 / .18)"; rr(ctx,-L/2+1.5,-Wd/2+2,L,Wd,4); ctx.fill();
  ctx.fillStyle=mine?C.accent:C.surface; ctx.strokeStyle=mine?C.accent:C.muted; ctx.lineWidth=1.2; rr(ctx,-L/2,-Wd/2,L,Wd,4); ctx.fill(); ctx.stroke();
  ctx.fillStyle=mine?C.surface:C.fg; ctx.globalAlpha=mine?.9:.55; rr(ctx,L*.08,-Wd/2+2,L*.22,Wd-4,1.5); ctx.fill(); ctx.globalAlpha=1;
  ctx.restore();
}
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawCars(ctx){
  if(state.step==="idle"||state.step==="route"||state.step==="search"){ CARS.forEach(c=>drawCar(ctx,c.x,c.y,Math.atan2(c.dir[1],c.dir[0]),false)); }
  if(driver.pos) drawCar(ctx,driver.pos[0],driver.pos[1],driver.ang,true);
  if(state.step==="search"){ const [sx,sy]=toS(state.from.x,state.from.y); const ph=(performance.now()%1600)/1600;
    ctx.strokeStyle=C.accent; ctx.globalAlpha=(1-ph)*.6; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx,sy,14+ph*70,0,7); ctx.stroke(); ctx.globalAlpha=1; }
}
function tickCars(dt){
  if(reduce) return;
  CARS.forEach(c=>{ c.x+=c.dir[0]*c.v*dt*10; c.y+=c.dir[1]*c.v*dt*10;
    if(c.x<BOUND.x0||c.x>BOUND.x1) c.dir[0]*=-1; if(c.y<BOUND.y0||c.y>BOUND.y1) c.dir[1]*=-1; });
}

// ---------- geocoding ----------
function nearestStreet(arr,key,v){ return arr.reduce((a,b)=>Math.abs(b[key]-v)<Math.abs(a[key]-v)?b:a); }
function reverse(x,y){
  const p=PLACES.find(p=>!p.far && Math.hypot(p.x-x,p.y-y)<220); if(p) return pName(p);
  const park=PARKS.find(q=>x>q.x0&&x<q.x1&&y>q.y0&&y<q.y1); if(park) return pName(park);
  if(x<BOUND.x0-300||x>BOUND.x1+300||y<BOUND.y0-300||y>BOUND.y1+300) return lang==="ky"?"Шаардын сырты":"За городом";
  const ns=nearestStreet(NS,"x",x), ew=nearestStreet(EW,"y",y);
  const dNS=Math.abs(ns.x-x), dEW=Math.abs(ew.y-y);
  const num=v=>Math.max(1,Math.round(Math.abs(v)/16)+1);
  return dEW<dNS ? `${pName(ew)}, ${num(x-BOUND.x0)}` : `${pName(ns)}, ${num(y-BOUND.y0)}`;
}
function snap(p){ const ns=nearestStreet(NS,"x",p.x), ew=nearestStreet(EW,"y",p.y); return Math.abs(ns.x-p.x)<Math.abs(ew.y-p.y)?[ns.x,p.y]:[p.x,ew.y]; }
function nearestCross(p){ const ns=nearestStreet(NS,"x",p.x), ew=nearestStreet(EW,"y",p.y); return [ns.x,ew.y]; }
function buildRoute(a,b){
  const A=[a.x,a.y], B=[b.x,b.y], A0=nearestCross(a);
  let pts;
  if(b.far){ pts=[A,A0,[A0[0],EW[0].y],[BOUND.x0-200,EW[0].y],B]; }
  else { const B0=nearestCross(b); pts=[A,A0,[B0[0],A0[1]],B0,B]; } // L-shape along real streets
  pts=pts.filter((p,i)=>i===0||dist(p,pts[i-1])>1);
  let len=0; for(let i=1;i<pts.length;i++) len+=dist(pts[i-1],pts[i]);
  return {pts,len,drawn:1};
}
function pointAt(r,f){ let acc=0, target=f*r.len; for(let i=1;i<r.pts.length;i++){ const s=dist(r.pts[i-1],r.pts[i]); if(acc+s>=target){ const k=(target-acc)/s; const a=r.pts[i-1],b=r.pts[i]; return {p:[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k],ang:Math.atan2(b[1]-a[1],b[0]-a[0])}; } acc+=s; } const l=r.pts[r.pts.length-1],m=r.pts[r.pts.length-2]; return {p:l,ang:Math.atan2(l[1]-m[1],l[0]-m[0])}; }

  document.querySelectorAll("[data-svc]").forEach(b=>b.onclick=()=>{ const v=SVCS.find(x=>x.id===b.dataset.svc); state.service=v.id; state.tariff=v.def; state.loaders=0; state.fragile=false; if(state.step==="idle"){ render(); openSearch("to"); return; }

  on("ldMinus",()=>{ state.loaders=Math.max(0,state.loaders-1); render(); }); on("ldPlus",()=>{ state.loaders=Math.min(4,state.loaders+1); render(); });

}
function toast(msg){ const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); el.textContent=msg; $("#app").appendChild(el); setTimeout(()=>el.remove(),2200); }
function copy(text,msg){ try{ navigator.clipboard.writeText(text).then(()=>toast(msg),()=>toast(text)); }catch(e){ toast(text); } }

// search overlay
function openSearch(which){
  const layer=$("#layer");
  layer.innerHTML=`<div class="overlay" role="dialog" aria-label="${which==="to"?t("to"):t("from")}"><div class="searchrow"><button class="round" id="sBack" style="box-shadow:none;background:var(--surface-2)" aria-label="${t("backBtn")}">${IC.back}</button>
    <label class="field">${IC.search}<input id="sQ" placeholder="${t("searchPh")}" autocomplete="off" aria-label="${t("searchPh")}"></label></div>
    <div class="list" id="sList"></div></div>`;
  const q=$("#sQ"), list=$("#sList");
  const items=()=>{
    const v=q.value.trim().toLowerCase();
    const cands=[...PLACES.map(p=>({x:p.x,y:p.y,name:pName(p),sub:p.k==="bz"?(lang==="ky"?"Базар":"Рынок"):p.k==="air"?(lang==="ky"?"Аэропорт":"Аэропорт"):p.k==="bus"?(lang==="ky"?"Автобекет":"Автовокзал"):"",far:p.far,alt:(p.ky+" "+p.ru).toLowerCase(),ic:p.k==="air"?IC.road:IC.pin})),
      ...NS.flatMap(n=>EW.map(e=>({x:n.x,y:e.y,name:`${pName(n)} / ${pName(e)}`,sub:lang==="ky"?"Кесилиш":"Перекрёсток",alt:(n.ky+" "+n.ru+" "+e.ky+" "+e.ru).toLowerCase(),ic:IC.map})))];
    const f=v?cands.filter(c=>c.alt.includes(v)):cands.slice(0,PLACES.length);
    const ref=state.from;
    list.innerHTML=`<button class="item" id="sMap"><span class="ib">${IC.map}</span><span class="grow"><b>${t("pickOnMap")}</b></span></button>`+
      (f.length?f.slice(0,40).map((c,i)=>`<button class="item" data-i="${i}"><span class="ib">${c.ic}</span><span class="grow"><b>${esc(c.name)}</b>${c.sub?`<small>${esc(c.sub)}</small>`:""}</span><span class="km">${(Math.hypot(c.x-ref.x,c.y-ref.y)*1.18/1000).toFixed(1)} ${t("km")}</span></button>`).join("")
      :`<p class="empty">${t("noFound")}</p>`);
    list.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{ const c=f[+b.dataset.i]; layer.innerHTML=""; const pt={x:c.x,y:c.y,name:c.name,far:c.far}; if(which==="to") setTo(pt); else { state.from=pt; centerOn(pt.x,pt.y); if(state.to) setTo(state.to); else render(); } });
    $("#sMap").onclick=()=>{ layer.innerHTML=""; state.pickMode=which; route=null; if(which==="to"&&state.to) centerOn(state.to.x,state.to.y); render(); };
  };
  q.oninput=items; items(); setTimeout(()=>q.focus(),60);
  $("#sBack").onclick=()=>{ layer.innerHTML=""; };
}
function recipientSheet(){
  const layer=$("#layer");
  layer.innerHTML=`<div class="overlay" role="dialog" aria-label="${t("recipient")}"><div class="searchrow"><button class="round" id="rBack" style="box-shadow:none;background:var(--surface-2)" aria-label="${t("backBtn")}">${IC.back}</button><h2 style="flex:1">${t("recipient")}</h2></div>
    <label class="field" style="margin-top:12px">${IC.note}<input id="rN" maxlength="40" placeholder="${t("rname")}" value="${esc(state.rname)}"></label>
    <label class="field" style="margin-top:8px">${IC.phone}<input id="rP" inputmode="tel" maxlength="20" placeholder="+996 555 00 00 00" aria-label="${t("rphone")}" value="${esc(state.rphone)}"></label>
    <button class="btn" id="rOk" style="margin-top:12px">${t("done")}</button></div>`;
  const close=()=>{ layer.innerHTML=""; };
  $("#rBack").onclick=close; $("#rOk").onclick=()=>{ state.rname=$("#rN").value.trim(); state.rphone=$("#rP").value.trim(); close(); render(); };
  setTimeout(()=>$("#rN").focus(),60);
}
function commentSheet(){
  const layer=$("#layer");
  layer.innerHTML=`<div class="overlay" role="dialog" aria-label="${t("comment")}"><div class="searchrow"><button class="round" id="cBack" style="box-shadow:none;background:var(--surface-2)" aria-label="${t("backBtn")}">${IC.back}</button><h2 style="flex:1">${t("comment")}</h2></div>
    <label class="field" style="margin-top:12px">${IC.note}<input id="cIn" maxlength="80" placeholder="${t("commentPh")}" value="${esc(state.comment)}"></label>
    <button class="btn" id="cOk" style="margin-top:12px">${t("done")}</button></div>`;
  const close=()=>{ layer.innerHTML=""; };
  $("#cBack").onclick=close; $("#cOk").onclick=()=>{ state.comment=$("#cIn").value.trim(); close(); render(); };
  setTimeout(()=>$("#cIn").focus(),60);
}
function setTo(pt){ state.to=pt; route=buildRoute(state.from,pt); state.step="route"; if(TARIFFS.find(x=>x.id===state.tariff).maxKm&&km()>9) state.tariff="parcel"; route.drawn=reduce?1:0; animRoute=performance.now(); render(); fitRoute(); }
let animRoute=0;
function fitRoute(){ if(!route) return; const xs=route.pts.map(p=>p[0]), ys=route.pts.map(p=>p[1]); const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const desk=innerWidth>=900, availW=desk?W-460:W-60, availH=desk?H-160:Math.max(160,H-sheetH()-150);
  const z=Math.min(0.45,Math.max(0.012,Math.min(availW/Math.max(200,x1-x0),availH/Math.max(200,y1-y0))));
  flyTo((x0+x1)/2,(y0+y1)/2,z); }
function centerOn(x,y){ flyTo(x,y,Math.max(cam.z,0.17)); }
let fly=null;
function flyTo(x,y,z){ if(reduce){ cam.x=x; cam.y=y; cam.z=z; dirty=true; return; } fly={x0:cam.x,y0:cam.y,z0:cam.z,x,y,z,t0:performance.now(),d:420}; }

// order flow
function startSearch(){ state.step="search"; render(); const d=DRIVERS[state.tariff]; driver.data=d[Math.floor(Math.random()*d.length)];
  setTimeout(()=>{ if(state.step!=="search") return; // nearest ambient car becomes the driver
    const c=CARS.reduce((a,b)=>Math.hypot(b.x-state.from.x,b.y-state.from.y)<Math.hypot(a.x-state.from.x,a.y-state.from.y)?b:a);
    const startPt={x:c.x,y:c.y}; driver.leg=buildRoute(startPt,state.from); driver.pos=[c.x,c.y]; driver.start=performance.now(); driver.dur=reduce?4000:9000; driver.phase="pickup"; state.step="enroute"; render(); }, reduce?800:2600); }
function cancel(){ state.step=state.to?"route":"idle"; driver.pos=null; driver.phase=null; toast(t("cancelled")); render(); }
function startTrip(){ driver.leg=route; driver.start=performance.now(); driver.dur=reduce?5000:14000; driver.phase="trip"; state.step="trip"; render(); }
function shareTrip(){ const d=driver.data; copy(`Жолдош: ${state.from.name} → ${state.to.name}. ${d.n}, ${d.car}${d.plate[0]?", "+d.plate[1]+" "+d.plate[0]+" KG":""}.`, t("shared")); }
function finish(){ const tf=TARIFFS.find(x=>x.id===state.tariff); trips.unshift({from:state.from.name,to:state.to.name,tf:state.tariff,p:price(tf,km())+state.tipAmt,at:Date.now(),r:state.rating}); saveTrips();
  if(state.rating) toast(t("rateThanks")); state.step="idle"; state.to=null; route=null; driver.pos=null; driver.phase=null; state.rating=0; state.tipAmt=0; state.fragile=false; state.comment=""; state.loaders=0; state.rname=""; state.rphone="";
  state.from={x:cam.x,y:cam.y,name:reverse(cam.x,cam.y)}; render(); }

// ---------- menu ----------
function openMenu(){
  const layer=$("#layer"); const lst=trips.length?trips.map(x=>`<div class="trip"><b>${esc(x.from)} → ${esc(x.to)}</b><span>${new Date(x.at).toLocaleDateString(lang==="ky"?"ky-KG":"ru-RU",{day:"numeric",month:"short"})} · ${t("t_"+x.tf)} · ${fmt(x.p)} ${t("som")}${x.r?" · ★ "+x.r:""}</span></div>`).join(""):`<p class="note">${t("noTrips")}</p>`;
  layer.innerHTML=`<div class="scrim" id="scrim"></div><nav class="drawer" aria-label="Меню"><div class="brand" style="box-shadow:none;padding-left:0"><i>${IC.road}</i><span>Жолдош</span></div>
    <div><h3>${t("trips")}</h3>${lst}</div><div><h3>${t("support")}</h3><p class="note">${t("supportText")}</p></div><p class="note" style="margin-top:auto">${t("demo")}</p></nav>`;
  $("#scrim").onclick=()=>layer.innerHTML="";
}

// ---------- map interaction ----------
let drag=null; const pointers=new Map();
cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId,[e.clientX,e.clientY]); fly=null;
  if(pointers.size===1){ drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false}; } cv.classList.add("dragging"); });
cv.addEventListener("pointermove",e=>{ if(!pointers.has(e.pointerId)) return; pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if(pointers.size===2){ const [a,b]=[...pointers.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(drag&&drag.pd){ zoomBy(d/drag.pd); } drag={...(drag||{}),pd:d}; return; }
  if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3){ drag.moved=true; $("#pin").classList.add("lift"); }
  cam.x=drag.cx-dx/cam.z; cam.y=drag.cy-dy/cam.z; dirty=true; if(state.pickMode){ const n=$("#pickName"); if(n) n.textContent=reverse(cam.x,cam.y); } });
const endDrag=e=>{ pointers.delete(e.pointerId); if(pointers.size) return; cv.classList.remove("dragging"); $("#pin").classList.remove("lift");
  if(drag&&drag.moved&&state.step==="idle"&&!state.pickMode){ state.from={x:cam.x,y:cam.y,name:reverse(cam.x,cam.y)}; setPinTag(); }
  drag=null; };
cv.addEventListener("pointerup",endDrag); cv.addEventListener("pointercancel",endDrag);
cv.addEventListener("wheel",e=>{ e.preventDefault(); zoomBy(e.deltaY<0?1.12:1/1.12); },{passive:false});
function zoomBy(f){ cam.z=Math.min(0.6,Math.max(0.012,cam.z*f)); dirty=true; }

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(fly){ const k=Math.min(1,(now-fly.t0)/fly.d), e=1-Math.pow(1-k,3); cam.x=fly.x0+(fly.x-fly.x0)*e; cam.y=fly.y0+(fly.y-fly.y0)*e; cam.z=fly.z0+(fly.z-fly.z0)*e; dirty=true; if(k>=1) fly=null; }
  if(route&&route.drawn<1){ route.drawn=Math.min(1,(now-animRoute)/700); dirty=true; }
  if(state.step==="idle"||state.step==="route"||state.step==="search"){ if(!reduce){ tickCars(dt); dirty=true; } }
  if(driver.phase){ const f=Math.min(1,(now-driver.start)/driver.dur); const at=pointAt(driver.leg,f); driver.pos=at.p; driver.ang=at.ang; driver.f=f; dirty=true;
    if(driver.phase==="pickup"){ const el=$("#etaN"); if(el) el.textContent=Math.max(1,Math.ceil((1-f)*driver.dur/1000/2.2))+" "+t("min");
      if(f>=1){ driver.phase=null; state.step="waiting"; driver.waitUntil=now+180000; render(); } }
    else if(driver.phase==="trip"){ const leftKm=km()*(1-f); const a=$("#tripKm"), b=$("#tripMin"), c=$("#tripBar"); if(a) a.textContent=leftKm.toFixed(1)+" "+t("km"); if(b) b.textContent=Math.max(1,Math.round(leftKm*2.4))+" "+t("min"); if(c) c.style.width=Math.round(f*100)+"%";
      if(f>=1){ driver.phase=null; state.step="done"; render(); } } }
  if(state.step==="waiting"){ const w=$("#waitN"); if(w){ const s=Math.max(0,Math.round((driver.waitUntil-now)/1000)); w.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); } }
  if(state.step==="search") dirty=true;
  if(dirty) draw();
  requestAnimationFrame(frame);
}

// ---------- boot ----------
function setLang(l){ lang=l; try{ localStorage.setItem("jt-lang",l); }catch(e){} document.documentElement.lang=l==="ky"?"ky":"ru";
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===l)));
  if(state.step==="idle") state.from.name=reverse(state.from.x,state.from.y);
  if(state.to&&!state.to.far){ /* keep chosen names */ } render(); dirty=true; }
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
$("#menuBtn").innerHTML=IC.menu; $("#brandIc").innerHTML=IC.road; $("#zin").innerHTML=IC.plus; $("#zout").innerHTML=IC.minus; $("#locate").innerHTML=IC.locate;
$("#menuBtn").onclick=openMenu; $("#zin").onclick=()=>zoomBy(1.35); $("#zout").onclick=()=>zoomBy(1/1.35);
$("#locate").onclick=()=>{ if(state.step==="idle"){ centerOn(-640,-1300); state.from={x:-640,y:-1300,name:reverse(-640,-1300)}; setPinTag(); } else if(route) fitRoute(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ readColors(); dirty=true; });
new MutationObserver(()=>{ readColors(); dirty=true; }).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
addEventListener("resize",resize);
spawnCars(); readColors();
state.from.name=reverse(state.from.x,state.from.y);
document.documentElement.lang=lang==="ky"?"ky":"ru";
document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
render(); resize();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ dirty=true; });
requestAnimationFrame(frame);
})();
</script>
