<title>Жолдош попутки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: phone-shaped single column app shell, sticky top bar, fixed bottom tab bar */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --field:#eaefec; --fg:#14201a; --muted:#66756d; --line:#dfe6e2;
  --accent:#1fbf6b; --accent-strong:#14a159; --accent-soft:#e3f6eb; --on-accent:#ffffff;
  --danger:#e5534b; --warn-bg:#fff8dc; --warn-line:#f0dc8a; --star:#f5b301;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211c; --field:#222d27; --fg:#e8efe9; --muted:#93a39a; --line:#2a352f;
  --accent:#2fd17c; --accent-strong:#25b86b; --accent-soft:#1c3427; --on-accent:#06150c;
  --danger:#f0716a; --warn-bg:#2d2a17; --warn-line:#5a5020; --star:#f7c23a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211c; --field:#222d27; --fg:#e8efe9; --muted:#93a39a; --line:#2a352f;
  --accent:#2fd17c; --accent-strong:#25b86b; --accent-soft:#1c3427; --on-accent:#06150c;
  --danger:#f0716a; --warn-bg:#2d2a17; --warn-line:#5a5020; --star:#f7c23a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:54px;
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.topbar h1{margin:0;text-align:center;font:700 16px/1.2 var(--f-display);text-wrap:balance}
.topbar .sub{display:block;font:500 12px var(--f-body);color:var(--muted)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--accent)}
.icon-btn:hover{background:var(--accent-soft)}
main{flex:1;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab .dot{position:absolute;top:5px;left:calc(50% + 7px);min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
h2{font:700 22px/1.25 var(--f-display);margin:4px 0 0;text-wrap:balance}
h3{font:700 16px/1.3 var(--f-display);margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.field{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:12px;padding:0 14px;min-height:50px;position:relative}
.field svg{color:var(--accent);flex:none;width:20px;height:20px}
.field input,.field select,.field textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:none;padding:13px 0;font-size:15px}
.field textarea{resize:vertical;min-height:84px}
.field:focus-within{box-shadow:0 0 0 2px var(--accent)}
label.lbl{font-size:13px;color:var(--muted);font-weight:500}
.route-fields{position:relative;display:flex;flex-direction:column;gap:8px}
.swap{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent);z-index:2}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.grid2>*{min-width:0}
.counter{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:50px;background:var(--surface)}
.counter button{height:100%;color:var(--accent);font-size:20px;display:grid;place-items:center}
.counter button:disabled{color:var(--muted);opacity:.5}
.counter span{text-align:center;font-weight:600;background:var(--field);height:100%;display:flex;align-items:center;justify-content:center;gap:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--field);font-weight:500;font-size:14px}
.chip.on{background:var(--accent);color:var(--on-accent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.toggle{width:64px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:attr(data-label);position:absolute;right:10px;top:7px;font-size:11px;font-weight:700;color:var(--muted)}
.toggle i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:10px;right:auto;color:var(--on-accent)}
.toggle.on i{left:35px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;background:var(--accent);color:var(--on-accent);font:700 16px var(--f-display);letter-spacing:.02em;width:100%;padding:0 16px}
.btn:hover{background:var(--accent-strong)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:38px;font-size:14px;width:auto}
.btn:disabled{opacity:.5;cursor:default}
.guide{display:flex;flex-direction:column;gap:8px}
.guide .card{padding:12px 14px}
.guide b{font-family:var(--f-display);font-size:14px}
.guide p{margin:2px 0 0;font-size:13px;color:var(--muted)}
/* trip card */
.trip{display:grid;grid-template-columns:1fr 1px 1.15fr;gap:14px;text-align:left;width:100%}
.trip .sep{background:var(--line)}
.tl{display:grid;grid-template-columns:22px 1fr;column-gap:8px}
.tl .rail{display:flex;flex-direction:column;align-items:center;grid-row:1/3}
.tl .rail .dots{flex:1;border-left:2px dotted var(--accent);margin:4px 0;min-height:22px}
.tl .rail svg{width:20px;height:20px;color:var(--accent)}
.tl .stop .d{font-size:12px;color:var(--muted)}
.tl .stop .t{font:600 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tl .stop .c{font-size:14px}
.tl .stop+.stop{margin-top:6px}
.who{display:flex;flex-direction:column;gap:10px;min-width:0}
.who .p{display:flex;gap:10px;align-items:center;min-width:0}
.who .p div{min-width:0}
.who .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .s{font-size:12px;color:var(--muted)}
.seats{display:flex;gap:3px;color:var(--muted)}
.seats svg{width:16px;height:16px}
.seats .taken{color:var(--line)}
.price{font:700 20px var(--f-display);color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-variant-numeric:tabular-nums}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 17px var(--f-display);color:#fff}
.avatar.lg{width:104px;height:104px;font-size:38px}
.avatar.sm{width:36px;height:36px;font-size:14px}
.carpic{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--field);color:var(--muted)}
.carpic svg{width:26px;height:26px}
.stars{display:inline-flex;gap:1px;color:var(--star);vertical-align:-2px}
.stars svg{width:15px;height:15px}
.stars .off{color:var(--line)}
.banner{background:var(--warn-bg);border:1.5px solid var(--warn-line);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center}
.kv{display:flex;flex-direction:column;gap:4px}
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:15px 16px;width:100%;text-align:left;font-size:15px}
.li+.li{border-top:1px solid var(--line)}
.li svg.ic{width:22px;height:22px;color:var(--accent);flex:none}
.li .grow{flex:1;min-width:0}
.chev{color:var(--muted);width:18px;height:18px;flex:none}
.li.danger,.li.danger svg.ic{color:var(--danger)}
.section-title{font:700 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
.hero-profile{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.hero-profile .avatar{background:rgba(255,255,255,.25)!important;border:2px solid rgba(255,255,255,.6)}
.hero-profile b{font:700 18px var(--f-display);display:block}
.ratingbox{background:var(--accent-soft);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}
.ratingbox b{font:700 20px var(--f-display);margin-right:6px}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--field);overflow:hidden}
.bar i{display:block;height:100%;background:var(--star)}
.review+.review{border-top:1px solid var(--line);padding-top:12px}
.review p{margin:6px 0 0;font-size:14px}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center}
.swatch.on{outline:2.5px solid var(--fg);outline-offset:2px}
.swatch svg{width:18px;height:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;color:var(--muted);background:var(--surface)}
.seg button.on{border-color:var(--accent);color:var(--fg)}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty svg{width:48px;height:48px;color:var(--accent);opacity:.7}
.notif{display:flex;gap:12px;align-items:flex-start}
.notif .ic{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.notif .ic svg{width:20px;height:20px}
.notif.unread{border-left:3px solid var(--accent)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);letter-spacing:.03em}
.pill.grey{background:var(--field);color:var(--muted)}
.pill.red{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.contact{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin:12px -16px -16px}
.contact a,.contact button{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;color:var(--accent);text-decoration:none;font-weight:500}
.contact a+a,.contact a+button{border-left:1px solid var(--line)}
.contact svg{width:20px;height:20px}
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:500;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.stargrab{display:flex;gap:6px;justify-content:center;color:var(--star)}
.stargrab button svg{width:36px;height:36px}
.stargrab button.off{color:var(--line)}
.citylist{max-height:50vh;overflow:auto;display:flex;flex-direction:column}
.citylist button{text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.citylist svg{width:18px;height:18px;color:var(--accent)}
.tag-demo{font-size:11px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.lang{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:999px;padding:3px;font:700 12px var(--f-display)}
.lang button{padding:6px 9px;border-radius:999px;color:var(--muted)}
.lang button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:14px;padding:4px;gap:4px}
.mode button{min-height:44px;border-radius:11px;font:600 15px var(--f-display);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.mode button svg{width:20px;height:20px}
.mode button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.otp{font:700 30px var(--f-display)!important;letter-spacing:.5em;text-align:center;padding-left:.5em!important}
.demo-code{background:var(--warn-bg);border:1.5px dashed var(--warn-line);border-radius:12px;padding:10px 14px;font-size:13px}
.demo-code b{font:700 18px var(--f-display);letter-spacing:.15em}
.linkbtn{color:var(--accent);font-weight:600;padding:6px 0}
.linkbtn:disabled{color:var(--muted);font-weight:500;cursor:default}
.uploads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.upl{position:relative;aspect-ratio:3/4;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center;font-size:11.5px;color:var(--muted);overflow:hidden;cursor:pointer}
.upl svg{width:26px;height:26px;color:var(--accent)}
.upl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.upl .ok{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;z-index:1}
.upl .ok svg{width:14px;height:14px;color:inherit}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upl.has{border-style:solid;border-color:var(--accent)}
.checkrow{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);cursor:pointer}
.checkrow input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:1px 0 0}
.badge-ok{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--accent-strong)}
.badge-ok svg{width:14px;height:14px}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sizes button{border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.sizes button b{font-size:14px;color:var(--fg)}
.sizes button.on{border-color:var(--accent);background:var(--accent-soft)}
.parcel-row{display:flex;gap:12px;align-items:flex-start}
.parcel-row .bx{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.parcel-row .bx svg{width:22px;height:22px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
</style>

<div class="app">
  <header class="topbar" id="topbar"></header>
  <main id="screen"></main>
</div>
<div class="tabs"><nav id="tabs"></nav></div>
<div id="overlay"></div>

// Demo: no SMS gateway, so the code is shown on screen. In production the server sends it via SMS.
const otp = {phone:"",code:"",until:0,timer:null};
function sendCode(phone){ otp.phone=phone; otp.code=String(Math.floor(1000+Math.random()*9000)); otp.until=Date.now()+60000; }
function otpBlock(){
  return `<p class="muted" style="margin:0">${t("codeSent",{phone:`<b style="color:var(--fg)">${esc(otp.phone)}</b>`})}</p>
    <div class="demo-code">${t("demoCode")} <b>${otp.code}</b></div>
    <div class="field">${I.key}<input id="otpIn" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]*" aria-label="${t("codeTitle")}"></div>
    <p class="small" id="otpErr" style="margin:0;color:var(--danger)" hidden></p>
    <button class="btn" id="otpOk" type="button">${t("confirm")}</button>
    <div class="row between"><button class="linkbtn" id="otpRe" type="button" disabled></button><button class="linkbtn" id="otpChange" type="button">${t("changeNumber")}</button></div>`;
}
function bindOtp(root,onOk,onChange){
  const inp=root.querySelector("#otpIn"), err=root.querySelector("#otpErr"), re=root.querySelector("#otpRe");
  const tick=()=>{ if(!document.body.contains(re)){ clearInterval(otp.timer); return; } const s=Math.ceil((otp.until-Date.now())/1000); if(s>0){ re.disabled=true; re.textContent=t("resendIn",{s}); } else { re.disabled=false; re.textContent=t("resend"); } };
  clearInterval(otp.timer); otp.timer=setInterval(tick,1000); tick();
  const check=()=>{ const v=inp.value.replace(/\D/g,""); if(v.length<4){ err.textContent=t("enterCode"); err.hidden=false; return; }
    if(v!==otp.code){ err.textContent=t("wrongCode"); err.hidden=false; inp.value=""; inp.focus(); return; }
    clearInterval(otp.timer); onOk(); };
  inp.oninput=()=>{ inp.value=inp.value.replace(/\D/g,"").slice(0,4); err.hidden=true; if(inp.value.length===4) check(); };
  root.querySelector("#otpOk").onclick=check;
  re.onclick=()=>{ sendCode(otp.phone); root.querySelector(".demo-code b").textContent=otp.code; toast(t("codeResent")); tick(); };
  root.querySelector("#otpChange").onclick=()=>{ clearInterval(otp.timer); onChange(); };
  setTimeout(()=>inp.focus(),60);
}

      <div class="rail">${I.pinO}<span class="dots"></span>${I.pin}</div>
      <div class="stop"><div class="d">${dShort(tr.date)}</div><div class="t">${tr.dep}</div><div class="c">${esc(tr.from)}</div></div>

      <div class="p"><div class="carpic">${I.car}</div><div><div class="n">${esc(d?.car?.brand||t("carLbl"))}</div><div class="s">${esc(d?.car?.model||"")}${d?.car?.year?", "+d.car.year:""}</div></div></div>

function parcelSheet(tr){
  let size="M";
  const d=user(tr.driverId);
  sheet(`<h3>${t("parcelTitle")}</h3>
    <p class="small muted" style="margin:-6px 0 0">${esc(tr.from)} → ${esc(tr.to)}, ${dShort(tr.date)}, ${tr.dep} · ${esc(d.name)}</p>
    <label class="lbl" for="pw">${t("parcelWhat")}</label>
    <div class="field">${I.box}<input id="pw" maxlength="60" placeholder="${t("parcelWhatPh")}"></div>
    <span class="lbl">${t("parcelSize")}</span>
    <div class="sizes" id="psz">${["S","M","L"].map(z=>`<button type="button" data-z="${z}"><b>${t("size"+z)}</b>${t("size"+z+"d")}<span style="color:var(--accent);font-weight:700">${sizePrice(tr.parcelPrice,z)} с</span></button>`).join("")}</div>
    <span class="lbl">${t("recipient")}</span>
    <div class="field">${I.user}<input id="prn" maxlength="30" placeholder="${t("recipientName")}" aria-label="${t("recipientName")}"></div>
    <div class="field">${I.phone}<input id="prp" inputmode="tel" value="+996 " placeholder="${t("recipientPhone")}" aria-label="${t("recipientPhone")}"></div>
    <p class="small muted" style="margin:0">${t("parcelNote")}</p>
    <button class="btn" id="pgo">${t("parcelSendFor",{sum:`<span id="psum"></span>`})}</button>`, el=>{
    const paint=()=>{ el.querySelectorAll("#psz button").forEach(b=>b.classList.toggle("on",b.dataset.z===size)); el.querySelector("#psum").textContent=sizePrice(tr.parcelPrice,size); };
    el.querySelector("#psz").onclick=e=>{ const b=e.target.closest("button"); if(b){ size=b.dataset.z; paint(); } }; paint();
    el.querySelector("#pgo").onclick=()=>{
      const what=el.querySelector("#pw").value.trim(), rname=el.querySelector("#prn").value.trim(), rphone=el.querySelector("#prp").value.trim();
      if(!what||rname.length<2){ toast(t("parcelFill")); return; }
      if(!validPhone(rphone)){ toast(t("checkPhone")); return; }
      const p={id:uid(),userId:"me",sender:S.me.name,senderPhone:S.me.phone,what,size,rname,rphone:fmtPhone(rphone),price:sizePrice(tr.parcelPrice,size),delivered:false};
      tr.parcels.push(p);
      notify("parcelNotif",{what,driver:d.name,from:tr.from,to:tr.to,date:tr.date,time:tr.dep,rname,rphone:p.rphone},"check",tr.id);
      closeSheet(); toast(t("parcelOk")); render();
    };
  });
}

function reviewSheet(tr){
  let val=5; const d=user(tr.driverId);
  sheet(`<h3>${t("reviewQ",{name:esc(d.name)})}</h3>
    <div class="stargrab" id="sg">${[1,2,3,4,5].map(i=>`<button data-v="${i}" aria-label="${i}">${I.star}</button>`).join("")}</div>
    <div class="field"><textarea id="rt" maxlength="300" placeholder="${t("reviewPh")}"></textarea></div>
    <button class="btn" id="rs">${t("sendReview")}</button>`, el=>{
    const paint=()=>el.querySelectorAll("#sg button").forEach(b=>b.classList.toggle("off",+b.dataset.v>val));
    el.querySelector("#sg").onclick=e=>{ const b=e.target.closest("button"); if(b){val=+b.dataset.v;paint();} }; paint();
    el.querySelector("#rs").onclick=()=>{ S.reviews.unshift({id:uid(),toId:tr.driverId,fromId:"me",tripId:tr.id,fromName:S.me.name,rating:val,text:el.querySelector("#rt").value.trim(),date:TODAY()});
      closeSheet(); toast(t("thanksReview")); render(); };
  });
}

function readPhoto(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
      const max=560, k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.6)); };
      img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

  $("#delAcc").onclick=()=>confirmSheet(t("deleteAccQ"),t("deleteAccText"),t("deleteForever"),()=>{ S=seed(S.lang); save(); stack=[]; render(); });
};

function phoneSheet(){
  const me=S.me;
  sheet(`<h3>${t("newPhone")}</h3><div class="field">${I.phone}<input id="np" inputmode="tel" value="+996 " aria-label="${t("newPhone")}"></div><button class="btn" id="ok">${t("getCode")}</button>`,el=>{
    el.querySelector("#ok").onclick=()=>{ const v=el.querySelector("#np").value.trim(); if(!validPhone(v)){toast(t("checkPhone"));return;}
      sendCode(fmtPhone(v));
      sheet(`<h3>${t("codeTitle")}</h3>${otpBlock()}`, el2=>bindOtp(el2,()=>{ me.phone=otp.phone; S.trips.forEach(x=>x.booked.forEach(b=>{ if(b.userId==="me") b.phone=otp.phone; })); closeSheet(); toast(t("phoneUpdated")); render(); }, phoneSheet));
    };
  });
}

screens.editName = () => {
  const me=S.me; topbar(t("nameAgeGender"),{canBack:true});
  let g=me.gender;
  $("#screen").innerHTML=`<form class="stack" id="nf" novalidate>
    <label class="lbl" for="nN">${t("name")}</label><div class="field">${I.user}<input id="nN" maxlength="30" value="${esc(me.name)}"></div>
    <label class="lbl" for="nA">${t("age")}</label><div class="field">${I.hash}<input id="nA" type="number" min="16" max="99" inputmode="numeric" value="${esc(me.age)}" placeholder="${t("agePh")}"></div>
    <span class="lbl">${t("gender")}</span><div class="seg"><button type="button" data-g="m" class="${g==="m"?"on":""}">${t("maleBtn")}</button><button type="button" data-g="f" class="${g==="f"?"on":""}">${t("femaleBtn")}</button></div>
    <button class="btn" type="submit">${t("save")}</button></form>`;
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{g=b.dataset.g;document.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("on",x===b));});
  $("#nf").onsubmit=e=>{e.preventDefault(); const n=$("#nN").value.trim(); if(n.length<2){toast(t("enterName"));return;}
    me.name=n; me.age=$("#nA").value; me.gender=g;
    S.trips.forEach(x=>{ x.booked.forEach(b=>{ if(b.userId==="me") b.name=n; }); (x.parcels||[]).forEach(p=>{ if(p.userId==="me") p.sender=n; }); });
    toast(t("saved")); back(); };
};

screens.car = () => {
  const me=S.me; const c=me.car?{...me.car}:{brand:"",model:"",year:"",plate:"",wheel:"L",color:"black"};
  topbar(t("carTitle"),{canBack:true});
  const draw=()=>{
  $("#screen").innerHTML=`<h2>${t("carQ")}</h2>
  <form class="stack" id="carf" novalidate>
    <div class="field">${I.car}<input id="cb" maxlength="30" placeholder="${t("brand")}" value="${esc(c.brand)}" list="brands" aria-label="${t("brand")}"></div>
    <datalist id="brands">${["Toyota","Honda","Lexus","Mercedes-Benz","BMW","Hyundai","Kia","Chevrolet","Daewoo","Volkswagen","Audi","Nissan","Mitsubishi","Subaru","Mazda","Lada","Ford","Opel","Changan","Haval","Chery","BYD","Zeekr","Li Auto"].map(b=>`<option value="${b}">`).join("")}</datalist>
    <div class="field">${I.car}<input id="cm" maxlength="30" placeholder="${t("model")}" value="${esc(c.model)}" aria-label="${t("model")}"></div>
    <div class="field">${I.cal}<input id="cy" type="number" min="1970" max="${new Date().getFullYear()+1}" inputmode="numeric" placeholder="${t("year")}" value="${esc(c.year)}" aria-label="${t("year")}"></div>
    <div class="field">${I.plate}<input id="cpl" maxlength="12" placeholder="${t("plate")}" value="${esc(c.plate)}" aria-label="${t("plate")}" style="text-transform:uppercase"></div>
    <p class="small muted" style="margin:-4px 0 0 4px">${t("plateNote")}</p>
    <span class="lbl">${t("wheelLbl",{w:t("wheel_"+c.wheel)})}</span>
    <div class="seg"><button type="button" data-w="L" class="${c.wheel==="L"?"on":""}">${t("leftBtn")}</button><button type="button" data-w="R" class="${c.wheel==="R"?"on":""}">${t("rightBtn")}</button></div>
    <span class="lbl">${t("colorLbl",{c:t("c_"+c.color)})}</span>
    <div class="colors">${COLORS.map(([n,h])=>`<button type="button" class="swatch ${c.color===n?"on":""}" data-c="${n}" style="background:${h};color:${["white","yellow"].includes(n)?"#222":"#fff"}" aria-label="${t("c_"+n)}">${c.color===n?I.check:""}</button>`).join("")}</div>
    <button class="btn" type="submit">${me.car?t("save"):t("add")}</button>
    ${me.car?`<button class="btn ghost" type="button" id="rmCar">${t("removeCar")}</button>`:""}
  </form>`;
  const keep=()=>{ c.brand=$("#cb").value; c.model=$("#cm").value; c.year=$("#cy").value; c.plate=$("#cpl").value.toUpperCase(); };
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{keep();c.wheel=b.dataset.w;draw();});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{keep();c.color=b.dataset.c;draw();});
  $("#carf").onsubmit=e=>{e.preventDefault(); keep(); if(!c.brand.trim()||!c.model.trim()){toast(t("needBrand"));return;}
    me.car={brand:c.brand.trim(),model:c.model.trim(),year:c.year?+c.year:"",plate:c.plate.trim(),wheel:c.wheel,color:c.color};
    toast(t("carSaved")); back(); };
  const rm=$("#rmCar"); if(rm) rm.onclick=()=>confirmSheet(t("removeCarQ"),t("removeCarText"),t("del"),()=>{me.car=null;back();});
  };
  draw();
};

checkVerification();
render();
})();
</script>
