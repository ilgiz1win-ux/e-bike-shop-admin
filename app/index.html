<title>Жолдош попутки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: phone-shaped single column app shell, sticky top bar, fixed bottom tab bar */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --field:#eaefec; --fg:#14201a; --muted:#66756d; --line:#dfe6e2;
  --accent:#1fbf6b; --accent-strong:#14a159; --accent-soft:#e3f6eb; --on-accent:#ffffff;
  --danger:#e5534b; --warn-bg:#fff8dc; --warn-line:#f0dc8a; --star:#f5b301;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211c; --field:#222d27; --fg:#e8efe9; --muted:#93a39a; --line:#2a352f;
  --accent:#2fd17c; --accent-strong:#25b86b; --accent-soft:#1c3427; --on-accent:#06150c;
  --danger:#f0716a; --warn-bg:#2d2a17; --warn-line:#5a5020; --star:#f7c23a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211c; --field:#222d27; --fg:#e8efe9; --muted:#93a39a; --line:#2a352f;
  --accent:#2fd17c; --accent-strong:#25b86b; --accent-soft:#1c3427; --on-accent:#06150c;
  --danger:#f0716a; --warn-bg:#2d2a17; --warn-line:#5a5020; --star:#f7c23a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:54px;
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.topbar h1{margin:0;text-align:center;font:700 16px/1.2 var(--f-display);text-wrap:balance}
.topbar .sub{display:block;font:500 12px var(--f-body);color:var(--muted)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--accent)}
.icon-btn:hover{background:var(--accent-soft)}
main{flex:1;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab .dot{position:absolute;top:5px;left:calc(50% + 7px);min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
h2{font:700 22px/1.25 var(--f-display);margin:4px 0 0;text-wrap:balance}
h3{font:700 16px/1.3 var(--f-display);margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.field{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:12px;padding:0 14px;min-height:50px;position:relative}
.field svg{color:var(--accent);flex:none;width:20px;height:20px}
.field input,.field select,.field textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:none;padding:13px 0;font-size:15px}
.field textarea{resize:vertical;min-height:84px}
.field:focus-within{box-shadow:0 0 0 2px var(--accent)}
label.lbl{font-size:13px;color:var(--muted);font-weight:500}
.route-fields{position:relative;display:flex;flex-direction:column;gap:8px}
.swap{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent);z-index:2}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.grid2>*{min-width:0}
.counter{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:50px;background:var(--surface)}
.counter button{height:100%;color:var(--accent);font-size:20px;display:grid;place-items:center}
.counter button:disabled{color:var(--muted);opacity:.5}
.counter span{text-align:center;font-weight:600;background:var(--field);height:100%;display:flex;align-items:center;justify-content:center;gap:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--field);font-weight:500;font-size:14px}
.chip.on{background:var(--accent);color:var(--on-accent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.toggle{width:64px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:attr(data-label);position:absolute;right:10px;top:7px;font-size:11px;font-weight:700;color:var(--muted)}
.toggle i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:10px;right:auto;color:var(--on-accent)}
.toggle.on i{left:35px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;background:var(--accent);color:var(--on-accent);font:700 16px var(--f-display);letter-spacing:.02em;width:100%;padding:0 16px}
.btn:hover{background:var(--accent-strong)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:38px;font-size:14px;width:auto}
.btn:disabled{opacity:.5;cursor:default}
.guide{display:flex;flex-direction:column;gap:8px}
.guide .card{padding:12px 14px}
.guide b{font-family:var(--f-display);font-size:14px}
.guide p{margin:2px 0 0;font-size:13px;color:var(--muted)}
/* trip card */
.trip{display:grid;grid-template-columns:1fr 1px 1.15fr;gap:14px;text-align:left;width:100%}
.trip .sep{background:var(--line)}
.tl{display:grid;grid-template-columns:22px 1fr;column-gap:8px}
.tl .rail{display:flex;flex-direction:column;align-items:center;grid-row:1/3}
.tl .rail .dots{flex:1;border-left:2px dotted var(--accent);margin:4px 0;min-height:22px}
.tl .rail svg{width:20px;height:20px;color:var(--accent)}
.tl .stop .d{font-size:12px;color:var(--muted)}
.tl .stop .t{font:600 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tl .stop .c{font-size:14px}
.tl .stop+.stop{margin-top:6px}
.who{display:flex;flex-direction:column;gap:10px;min-width:0}
.who .p{display:flex;gap:10px;align-items:center;min-width:0}
.who .p div{min-width:0}
.who .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .s{font-size:12px;color:var(--muted)}
.seats{display:flex;gap:3px;color:var(--muted)}
.seats svg{width:16px;height:16px}
.seats .taken{color:var(--line)}
.price{font:700 20px var(--f-display);color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-variant-numeric:tabular-nums}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 17px var(--f-display);color:#fff}
.avatar.lg{width:104px;height:104px;font-size:38px}
.avatar.sm{width:36px;height:36px;font-size:14px}
.carpic{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--field);color:var(--muted)}
.carpic svg{width:26px;height:26px}
.stars{display:inline-flex;gap:1px;color:var(--star);vertical-align:-2px}
.stars svg{width:15px;height:15px}
.stars .off{color:var(--line)}
.banner{background:var(--warn-bg);border:1.5px solid var(--warn-line);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center}
.kv{display:flex;flex-direction:column;gap:4px}
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:15px 16px;width:100%;text-align:left;font-size:15px}
.li+.li{border-top:1px solid var(--line)}
.li svg.ic{width:22px;height:22px;color:var(--accent);flex:none}
.li .grow{flex:1;min-width:0}
.chev{color:var(--muted);width:18px;height:18px;flex:none}
.li.danger,.li.danger svg.ic{color:var(--danger)}
.section-title{font:700 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
.hero-profile{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.hero-profile .avatar{background:rgba(255,255,255,.25)!important;border:2px solid rgba(255,255,255,.6)}
.hero-profile b{font:700 18px var(--f-display);display:block}
.ratingbox{background:var(--accent-soft);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}
.ratingbox b{font:700 20px var(--f-display);margin-right:6px}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--field);overflow:hidden}
.bar i{display:block;height:100%;background:var(--star)}
.review+.review{border-top:1px solid var(--line);padding-top:12px}
.review p{margin:6px 0 0;font-size:14px}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center}
.swatch.on{outline:2.5px solid var(--fg);outline-offset:2px}
.swatch svg{width:18px;height:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;color:var(--muted);background:var(--surface)}
.seg button.on{border-color:var(--accent);color:var(--fg)}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty svg{width:48px;height:48px;color:var(--accent);opacity:.7}
.notif{display:flex;gap:12px;align-items:flex-start}
.notif .ic{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.notif .ic svg{width:20px;height:20px}
.notif.unread{border-left:3px solid var(--accent)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);letter-spacing:.03em}
.pill.grey{background:var(--field);color:var(--muted)}
.pill.red{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.contact{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin:12px -16px -16px}
.contact a,.contact button{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;color:var(--accent);text-decoration:none;font-weight:500}
.contact a+a,.contact a+button{border-left:1px solid var(--line)}
.contact svg{width:20px;height:20px}
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:500;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.stargrab{display:flex;gap:6px;justify-content:center;color:var(--star)}
.stargrab button svg{width:36px;height:36px}
.stargrab button.off{color:var(--line)}
.citylist{max-height:50vh;overflow:auto;display:flex;flex-direction:column}
.citylist button{text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.citylist svg{width:18px;height:18px;color:var(--accent)}
.tag-demo{font-size:11px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="topbar" id="topbar"></header>
  <main id="screen"></main>
</div>
<div class="tabs"><nav id="tabs"></nav></div>
<div id="overlay"></div>

let S;
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ S=JSON.parse(raw); return; } }catch(e){} S=seed(); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
load();
// keep demo trips fresh: if seed is stale (no trips today or later) reseed demo data but keep the user
(function refresh(){ const t=TODAY(); if(!S.trips.some(x=>x.date>=t && x.driverId!=="me")){ const me=S.me, mine=S.trips.filter(x=>x.driverId==="me"), n=S.notifs; const fresh=seed(); S={...fresh,me,notifs:n,trips:[...fresh.trips,...mine]}; save(); } })();

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const user = id => id==="me"?S.me:S.users.find(u=>u.id===id);
const avColor = s => AV[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%AV.length];
const avatar = (u,cls="") => `<div class="avatar ${cls}" style="background:${avColor(u?.name||"?")}">${esc((u?.name||"?").trim()[0]||"?").toUpperCase()}</div>`;
const reviewsOf = id => S.reviews.filter(r=>r.toId===id);
const ratingOf = id => { const r=reviewsOf(id); return r.length? r.reduce((a,b)=>a+b.rating,0)/r.length : 0; };
const stars = (v) => `<span class="stars">${[1,2,3,4,5].map(i=>`<span class="${i<=Math.round(v)?"":"off"}">${I.star}</span>`).join("")}</span>`;
const plural = (n,a,b,c)=>{ const m10=n%10,m100=n%100; return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c); };
const reviewsWord = n => `${n} ${plural(n,"отзыв","отзыва","отзывов")}`;
const seatsLeft = t => t.seats - t.booked.reduce((a,b)=>a+b.count,0);
const myBooking = t => t.booked.find(b=>b.userId==="me");
const dShort = s => { const d=parse(s); return `${d.getDate()} ${MON_S[d.getMonth()]} ${DAY_S[d.getDay()]}`; };
const dLong = s => { const d=parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${DAYS[d.getDay()]}`; };
const dRel = s => s===TODAY()?"Сегодня":s===addDays(1)?"Завтра":dShort(s);
const regTxt = s => { if(!s) return ""; const [y,m]=s.split("-").map(Number); return `${MON_S[m-1].replace(".","")[0].toUpperCase()+MON_S[m-1].slice(1)} ${y}`; };
const isPast = t => (t.date+"T"+t.dep) < (TODAY()+"T"+new Date().toTimeString().slice(0,5));
const carTxt = c => c? `${esc(c.brand)} ${esc(c.model)}${c.year?", "+esc(c.year):""}`:"";
const colorHex = name => (COLORS.find(c=>c[0]===name)||[,"#9e9e9e"])[1];
const tripsCount = id => S.trips.filter(t=>t.driverId===id && isPast(t)).length;

function toast(msg){ const el=document.createElement("div"); el.className="toast"; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2400); }
function notify(text,icon="bell",tripId=null){ S.notifs.unshift({id:uid(),text,icon,tripId,at:Date.now(),read:false}); }

function sheet(html, onMount){
  const ov=$("#overlay");
  ov.innerHTML=`<div class="sheet-wrap"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const wrap=ov.firstElementChild;
  wrap.addEventListener("click",e=>{ if(e.target===wrap) closeSheet(); });
  onMount && onMount(wrap.firstElementChild);
}
function closeSheet(){ $("#overlay").innerHTML=""; }
function confirmSheet(title,text,okLabel,onOk,danger=true){
  sheet(`<h3>${esc(title)}</h3><p class="muted" style="margin:0">${esc(text)}</p>
    <button class="btn ${danger?"danger":""}" id="cOk">${esc(okLabel)}</button><button class="btn ghost" id="cNo">Отмена</button>`, el=>{
    el.querySelector("#cOk").onclick=()=>{ closeSheet(); onOk(); };
    el.querySelector("#cNo").onclick=closeSheet;
  });
}
function citySheet(current,onPick){
  sheet(`<h3>Выберите город</h3>
    <div class="field">${I.search}<input id="cq" placeholder="Начните вводить…" autocomplete="off" value=""></div>
    <div class="citylist" id="cl"></div>`, el=>{
    const q=el.querySelector("#cq"), cl=el.querySelector("#cl");
    const draw=()=>{ const v=q.value.trim().toLowerCase(); const list=CITIES.filter(c=>c.toLowerCase().includes(v));
      const extra = v && !CITIES.some(c=>c.toLowerCase()===v) ? `<button data-c="${esc(q.value.trim())}">${I.pinO}<span>«${esc(q.value.trim())}»</span></button>`:"";
      cl.innerHTML = list.map(c=>`<button data-c="${esc(c)}">${I.pinO}<span>${esc(c)}</span>${c===current?'<span class="pill" style="margin-left:auto">выбран</span>':""}</button>`).join("")+extra; };
    q.oninput=draw; draw(); setTimeout(()=>q.focus(),50);
    cl.onclick=e=>{ const b=e.target.closest("button"); if(b){ closeSheet(); onPick(b.dataset.c); } };
  });
}

let tab="search";
let stack=[]; // [{name, params}]
const search = {from:"Бишкек",to:"Чолпон-Ата",date:TODAY(),pax:1,all:false};
const draft = {from:"Бишкек",to:"",date:TODAY(),dep:"09:00",arr:"",seats:3,price:"",payment:"Наличными",comment:""};

function go(name,params={}){ stack.push({name,params}); render(); window.scrollTo(0,0); }
function back(){ stack.pop(); render(); }
function switchTab(t){ tab=t; stack=[]; render(); window.scrollTo(0,0); }

function topbar(title,{sub="",canBack=false,right=""}={}){
  $("#topbar").innerHTML = `<div>${canBack?`<button class="icon-btn" id="bk" aria-label="Назад">${I.back}</button>`:""}</div>
  <h1>${esc(title)}${sub?`<span class="sub">${esc(sub)}</span>`:""}</h1><div>${right}</div>`;
  const b=$("#bk"); if(b) b.onclick=back;
}
function renderTabs(){
  const unread=S.notifs.filter(n=>!n.read).length;
  const items=[["trips","Поездки",I.road],["search","Поиск",I.search],["create","Создать",I.plus],["notifs","Уведомления",I.bell],["profile","Профиль",I.user]];
  $("#tabs").innerHTML = items.map(([k,l,ic])=>`<button class="tab ${tab===k?"on":""}" data-t="${k}" aria-label="${l}">${ic}<span>${l}</span>${k==="notifs"&&unread?`<b class="dot">${unread}</b>`:""}</button>`).join("");
  $("#tabs").onclick=e=>{ const b=e.target.closest(".tab"); if(b) switchTab(b.dataset.t); };
}

function render(){
  save();
  if(!S.me){ $(".tabs").hidden=true; return screens.welcome(); }
  $(".tabs").hidden=false;
  renderTabs();
  const top=stack[stack.length-1];
  if(top) return screens[top.name](top.params);
  return screens[tab]();
}

  $("#sDate").onchange=e=>{ if(e.target.value){s.date=e.target.value;render();} };
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{s.date=b.dataset.d;render();});
  $("#pm").onclick=()=>{s.pax=Math.max(1,s.pax-1);render();};
  $("#pp").onclick=()=>{s.pax=Math.min(6,s.pax+1);render();};
  $("#sAll").onclick=()=>{s.all=!s.all;render();};
  $("#sGo").onclick=()=>{
    if(!s.from||!s.to){ toast("Выберите города отправления и прибытия"); return; }
    if(s.from===s.to){ toast("Города должны отличаться"); return; }
    if(s.all){
      const drivers=new Set(S.trips.filter(t=>t.from===s.from&&t.to===s.to&&t.driverId!=="me").map(t=>t.driverId));
      S.requests.push({id:uid(),from:s.from,to:s.to,date:s.date,pax:s.pax});
      notify(`Запрос ${s.from} → ${s.to} на ${dRel(s.date).toLowerCase()} отправлен ${drivers.size||"всем"} ${plural(drivers.size,"водителю","водителям","водителям")}. Они свяжутся с вами.`,"bell");

  };
};

function reviewSheet(t){
  let val=5;
  const d=user(t.driverId);
  sheet(`<h3>Как прошла поездка с ${esc(d.name)}?</h3>
    <div class="stargrab" id="sg">${[1,2,3,4,5].map(i=>`<button data-v="${i}" aria-label="${i}">${I.star}</button>`).join("")}</div>
    <div class="field"><textarea id="rt" maxlength="300" placeholder="Расскажите другим попутчикам (необязательно)"></textarea></div>
    <button class="btn" id="rs">Отправить отзыв</button>`, el=>{
    const paint=()=>el.querySelectorAll("#sg button").forEach(b=>b.classList.toggle("off",+b.dataset.v>val));
    el.querySelector("#sg").onclick=e=>{ const b=e.target.closest("button"); if(b){val=+b.dataset.v;paint();} }; paint();
    el.querySelector("#rs").onclick=()=>{ S.reviews.unshift({id:uid(),toId:t.driverId,fromId:"me",tripId:t.id,fromName:S.me.name,rating:val,text:el.querySelector("#rt").value.trim(),date:TODAY()});
      closeSheet(); toast("Спасибо за отзыв!"); render(); };
  });
}

  $("#pd").onclick=()=>go("personal");
  document.querySelectorAll("[data-info]").forEach(b=>b.onclick=()=>go("info",{k:b.dataset.info}));
  $("#rate").onclick=()=>{ let v=5; sheet(`<h3>Нравится Жолдош?</h3><div class="stargrab" id="sg">${[1,2,3,4,5].map(i=>`<button data-v="${i}">${I.star}</button>`).join("")}</div><button class="btn" id="ok">Оценить</button>`,el=>{
    const paint=()=>el.querySelectorAll("#sg button").forEach(b=>b.classList.toggle("off",+b.dataset.v>v));
    el.querySelector("#sg").onclick=e=>{const b=e.target.closest("button"); if(b){v=+b.dataset.v;paint();}}; paint();
    el.querySelector("#ok").onclick=()=>{closeSheet();toast(v>=4?"Спасибо! Нам очень приятно":"Спасибо, мы станем лучше");};
  }); };
  $("#out").onclick=()=>confirmSheet("Выйти из аккаунта?","Ваши поездки и брони на этом устройстве будут удалены.","Выйти",()=>{ S=seed(); save(); stack=[]; render(); });
};

const INFO = {
  about:["О приложении",`<p><b>Жолдош</b> — сервис попутных поездок по Кыргызстану. Водители публикуют поездки и делят расходы на бензин, пассажиры находят место в машине дешевле такси.</p><p>Сервис не является перевозчиком: договорённость о поездке заключается напрямую между водителем и пассажиром.</p>`],
  safety:["Безопасность",`<ul><li>Перед поездкой позвоните водителю и уточните место встречи.</li><li>Проверьте марку, цвет и номер автомобиля перед посадкой.</li><li>Читайте отзывы и выбирайте водителей с рейтингом.</li><li>Сообщите близким маршрут и время выезда.</li><li>Не переводите предоплату незнакомым людям.</li><li>В экстренной ситуации звоните <b>112</b>.</li></ul>`],
  terms:["Пользовательское соглашение",`<p>Используя приложение, вы подтверждаете, что указываете достоверные данные, соблюдаете ПДД и договорённости с попутчиками, а водитель имеет действующее водительское удостоверение.</p><p>Запрещено использовать сервис для коммерческих пассажирских перевозок без лицензии.</p>`],
  privacy:["Политика конфиденциальности",`<p>Мы храним имя, номер телефона и данные автомобиля. Номер телефона показывается только участникам ваших поездок. Госномер не отображается в поездке.</p><p>В демо-версии все данные хранятся только в памяти этого устройства.</p>`],
  feedback:["Обратная связь",null],
  contacts:["Контакты",`<p>Служба поддержки работает ежедневно с 9:00 до 21:00.</p><p>Бишкек, Кыргызстан</p><p class="muted small">Контакты будут добавлены после запуска.</p>`],
};
screens.info = ({k}) => {
  const [title,html]=INFO[k]; topbar(title,{canBack:true});
  if(k==="feedback"){
    $("#screen").innerHTML=`<form class="card stack" id="fb"><h3>Напишите нам</h3><p class="muted small" style="margin:0">Расскажите, что улучшить или какая возникла проблема.</p><div class="field"><textarea id="fbt" required maxlength="1000" placeholder="Ваше сообщение"></textarea></div><button class="btn" type="submit">Отправить</button></form>`;
    $("#fb").onsubmit=e=>{e.preventDefault(); if(!$("#fbt").value.trim()) return; toast("Сообщение сохранено. Спасибо!"); back();};
    return;
  }
  $("#screen").innerHTML=`<div class="card" style="line-height:1.6">${html}</div>`;
};

screens.personal = () => {
  const me=S.me; topbar("Личные данные",{canBack:true});
  const rv=reviewsOf("me"), r=ratingOf("me");
  $("#screen").innerHTML = `
  <div class="stack" style="align-items:center;gap:8px">${avatar(me,"lg")}<h2 style="margin:0">${esc(me.name)}</h2></div>
  <button class="ratingbox" id="myrev"><div><b>${rv.length?r.toFixed(1):"—"}</b>${stars(r)}<div class="small muted">${reviewsWord(rv.length)}</div></div>${I.chev}</button>
  <div class="row between small"><span><span class="muted">Дата регистрации:</span> ${regTxt(me.reg)}</span><span><span class="muted">Поездки:</span> ${tripsCount("me")}</span></div>
  <div class="list">
    <button class="li" id="eName"><span class="grow">Имя, возраст, пол<div class="small muted">${esc(me.name)}${me.age?", "+esc(me.age):""}${me.gender?", "+(me.gender==="м"?"мужской":"женский"):""}</div></span>${I.chev}</button>
    <button class="li" id="eCar"><span class="grow">Автомобиль<div class="small muted">${me.car?carTxt(me.car):"Не добавлен"}</div></span>${I.chev}</button>
    <button class="li" id="ePhone"><span class="grow">${esc(me.phone)}</span>${I.chev}</button>
  </div>
  <div class="list"><button class="li danger" id="delAcc">${I.trash}<span class="grow">Удалить аккаунт</span></button></div>`;
  $("#myrev").onclick=()=>go("user",{id:"me"});
  $("#eName").onclick=()=>go("editName");
  $("#eCar").onclick=()=>go("car");
  $("#ePhone").onclick=()=>sheet(`<h3>Номер телефона</h3><div class="field">${I.phone}<input id="np" inputmode="tel" value="${esc(me.phone)}"></div><button class="btn" id="ok">Сохранить</button>`,el=>{
    el.querySelector("#ok").onclick=()=>{ const v=el.querySelector("#np").value.trim(); if(v.replace(/\D/g,"").length<9){toast("Проверьте номер");return;} me.phone=v; closeSheet(); toast("Номер обновлён"); render(); };
  });
  $("#delAcc").onclick=()=>confirmSheet("Удалить аккаунт?","Профиль, поездки, брони и отзывы будут удалены без возможности восстановления.","Удалить навсегда",()=>{ S=seed(); save(); stack=[]; render(); });
};

screens.editName = () => {
  const me=S.me; topbar("Имя, возраст, пол",{canBack:true});
  let g=me.gender;
  $("#screen").innerHTML=`<form class="stack" id="nf">
    <label class="lbl" for="nN">Имя</label><div class="field">${I.user}<input id="nN" required maxlength="30" value="${esc(me.name)}"></div>
    <label class="lbl" for="nA">Возраст</label><div class="field">${I.hash}<input id="nA" type="number" min="16" max="99" inputmode="numeric" value="${esc(me.age)}" placeholder="Например, 25"></div>
    <span class="lbl">Пол</span><div class="seg"><button type="button" data-g="м" class="${g==="м"?"on":""}">Мужской</button><button type="button" data-g="ж" class="${g==="ж"?"on":""}">Женский</button></div>
    <button class="btn" type="submit">Сохранить</button></form>`;
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{g=b.dataset.g;document.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("on",x===b));});
  $("#nf").onsubmit=e=>{e.preventDefault(); const n=$("#nN").value.trim(); if(n.length<2){toast("Введите имя");return;}
    me.name=n; me.age=$("#nA").value; me.gender=g;
    S.trips.forEach(t=>t.booked.forEach(b=>{ if(b.userId==="me") b.name=n; }));
    toast("Сохранено"); back(); };
};

screens.car = () => {
  const me=S.me; const c=me.car?{...me.car}:{brand:"",model:"",year:"",plate:"",wheel:"Левый",color:"Чёрный"};
  topbar("Автомобиль",{canBack:true});
  const draw=()=>{
  $("#screen").innerHTML=`<h2>Какой у вас автомобиль?</h2>
  <form class="stack" id="carf">
    <div class="field">${I.car}<input id="cb" required maxlength="30" placeholder="Марка" value="${esc(c.brand)}" list="brands" aria-label="Марка"></div>
    <datalist id="brands">${["Toyota","Honda","Lexus","Mercedes-Benz","BMW","Hyundai","Kia","Chevrolet","Daewoo","Volkswagen","Audi","Nissan","Mitsubishi","Subaru","Mazda","Lada","Ford","Opel","Changan","Haval","Chery","BYD","Zeekr","Li Auto"].map(b=>`<option value="${b}">`).join("")}</datalist>
    <div class="field">${I.car}<input id="cm" required maxlength="30" placeholder="Модель" value="${esc(c.model)}" aria-label="Модель"></div>
    <div class="field">${I.cal}<input id="cy" type="number" min="1970" max="${new Date().getFullYear()+1}" inputmode="numeric" placeholder="Год выпуска" value="${esc(c.year)}" aria-label="Год выпуска"></div>
    <div class="field">${I.plate}<input id="cpl" maxlength="12" placeholder="Госномер" value="${esc(c.plate)}" aria-label="Госномер" style="text-transform:uppercase"></div>
    <p class="small muted" style="margin:-4px 0 0 4px">Госномер не показывается в поездке</p>
    <span class="lbl">Руль: ${esc(c.wheel)}</span>
    <div class="seg"><button type="button" data-w="Левый" class="${c.wheel==="Левый"?"on":""}">Левый руль</button><button type="button" data-w="Правый" class="${c.wheel==="Правый"?"on":""}">Правый руль</button></div>
    <span class="lbl">Цвет: ${esc(c.color)}</span>
    <div class="colors">${COLORS.map(([n,h])=>`<button type="button" class="swatch ${c.color===n?"on":""}" data-c="${n}" style="background:${h};color:${["Белый","Жёлтый"].includes(n)?"#222":"#fff"}" aria-label="${n}">${c.color===n?I.check:""}</button>`).join("")}</div>
    <button class="btn" type="submit">${me.car?"Сохранить":"Добавить"}</button>
    ${me.car?`<button class="btn ghost" type="button" id="rmCar">Удалить автомобиль</button>`:""}
  </form>`;
  const keep=()=>{ c.brand=$("#cb").value; c.model=$("#cm").value; c.year=$("#cy").value; c.plate=$("#cpl").value.toUpperCase(); };
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{keep();c.wheel=b.dataset.w;draw();});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{keep();c.color=b.dataset.c;draw();});
  $("#carf").onsubmit=e=>{e.preventDefault(); keep(); if(!c.brand.trim()||!c.model.trim()){toast("Укажите марку и модель");return;}
    me.car={brand:c.brand.trim(),model:c.model.trim(),year:c.year?+c.year:"",plate:c.plate.trim(),wheel:c.wheel,color:c.color};
    toast("Автомобиль сохранён"); back(); };
  const rm=$("#rmCar"); if(rm) rm.onclick=()=>confirmSheet("Удалить автомобиль?","Без автомобиля нельзя создавать новые поездки.","Удалить",()=>{me.car=null;back();});
  };
  draw();
};

render();
})();
</script>
