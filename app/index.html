<title>Жолдош попутки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-shaped single column app shell, sticky top bar, fixed bottom tab bar */
:root{
  /* Layout: phone-shaped single column, translucent top bar, floating bottom bar; trust blue as the brand colour */
  --bg:#f2f5fa; --surface:#ffffff; --field:#eaeff7; --fg:#0f1a2e; --muted:#5b6678; --line:#e0e6f0;
  --accent:#2563eb; --accent-strong:#1d4ed8; --accent-soft:#e7efff; --accent-ink:#1d4ed8; --on-accent:#ffffff;
  --ink:#1e40af; --ink2:#172f7a; --on-ink:#ffffff; --ink-muted:rgba(255,255,255,.78); --ok:#16a34a;
  --sel-bg:#2563eb; --sel-fg:#ffffff; --sel-ic:#ffffff;
  --st-open:#5b6678; --st-accepted:#7c3aed; --st-onway:#ea580c; --danger:#e5484d; --warn-bg:#fff8e6; --warn-line:#f3dc8c; --star:#f5a700;
  --shadow:0 1px 2px rgba(15,26,46,.04),0 6px 20px rgba(15,26,46,.07);
  --f-display:"Montserrat","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Montserrat","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c111b; --surface:#151c2a; --field:#1e2738; --fg:#e6ecf7; --muted:#97a3b8; --line:#263247;
  --accent:#4f8cff; --accent-strong:#6b9fff; --accent-soft:#16264a; --accent-ink:#8ab4ff; --on-accent:#06122b;
  --ink:#1e3a8a; --ink2:#142a63; --on-ink:#ffffff; --ink-muted:rgba(255,255,255,.75); --ok:#4ade80;
  --sel-bg:#4f8cff; --sel-fg:#06122b; --sel-ic:#06122b;
  --st-open:#97a3b8; --st-accepted:#a78bfa; --st-onway:#fb923c; --danger:#f0716a; --warn-bg:#2d2a17; --warn-line:#5a5020; --star:#f7c23a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c111b; --surface:#151c2a; --field:#1e2738; --fg:#e6ecf7; --muted:#97a3b8; --line:#263247;
  --accent:#4f8cff; --accent-strong:#6b9fff; --accent-soft:#16264a; --accent-ink:#8ab4ff; --on-accent:#06122b;
  --ink:#1e3a8a; --ink2:#142a63; --on-ink:#ffffff; --ink-muted:rgba(255,255,255,.75); --ok:#4ade80;
  --sel-bg:#4f8cff; --sel-fg:#06122b; --sel-ic:#06122b;
  --st-open:#97a3b8; --st-accepted:#a78bfa; --st-onway:#fb923c; --danger:#f0716a; --warn-bg:#2d2a17; --warn-line:#5a5020; --star:#f7c23a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:0.9375rem;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:54px;
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.topbar h1{margin:0;text-align:center;font:700 1rem/1.2 var(--f-display);text-wrap:balance}
.topbar .sub{display:block;font:500 0.75rem var(--f-body);color:var(--muted)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--accent-ink)}
.icon-btn:hover{background:var(--accent-soft)}
main{flex:1;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:0.6875rem;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent-ink)}
.tab .dot{position:absolute;top:5px;left:calc(50% + 7px);min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:0.625rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
h2{font:700 1.375rem/1.25 var(--f-display);margin:4px 0 0;text-wrap:balance}
h3{font:700 1rem/1.3 var(--f-display);margin:0}
.muted{color:var(--muted)}
.small{font-size:0.8125rem}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.field{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:12px;padding:0 14px;min-height:50px;position:relative}
.field svg{color:var(--accent-ink);flex:none;width:20px;height:20px}
.field input,.field select,.field textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:none;padding:13px 0;font-size:0.9375rem}
.field textarea{resize:vertical;min-height:84px}
.field:focus-within{box-shadow:0 0 0 2px var(--accent-ink)}
label.lbl{font-size:0.8125rem;color:var(--muted);font-weight:500}
.route-fields{position:relative;display:flex;flex-direction:column;gap:8px}
.swap{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent-ink);z-index:2}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.grid2>*{min-width:0}
.counter{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:50px;background:var(--surface)}
.counter button{height:100%;color:var(--accent-ink);font-size:1.25rem;display:grid;place-items:center}
.counter button:disabled{color:var(--muted);opacity:.5}
.counter span{text-align:center;font-weight:600;background:var(--field);height:100%;display:flex;align-items:center;justify-content:center;gap:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--field);font-weight:500;font-size:0.875rem}
.chip.on{background:var(--accent);color:var(--on-accent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:0.8125rem;color:var(--muted)}
.toggle{width:64px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:attr(data-label);position:absolute;right:10px;top:7px;font-size:0.6875rem;font-weight:700;color:var(--muted)}
.toggle i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:10px;right:auto;color:var(--on-accent)}
.toggle.on i{left:35px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;background:var(--accent);color:var(--on-accent);font:700 1rem var(--f-display);letter-spacing:.02em;width:100%;padding:0 16px}
.btn:hover{background:var(--accent-strong)}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1.5px solid var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:38px;font-size:0.875rem;width:auto}
.btn:disabled{opacity:.5;cursor:default}
.guide{display:flex;flex-direction:column;gap:8px}
.guide .card{padding:12px 14px}
.guide b{font-family:var(--f-display);font-size:0.875rem}
.guide p{margin:2px 0 0;font-size:0.8125rem;color:var(--muted)}
/* trip card */
.trip{display:grid;grid-template-columns:1fr 1px 1.15fr;gap:14px;text-align:left;width:100%}
.trip .sep{background:var(--line)}
.tl{display:grid;grid-template-columns:22px 1fr;column-gap:8px}
.tl .rail{display:flex;flex-direction:column;align-items:center;grid-row:1/3}
.tl .rail .dots{flex:1;border-left:2px dotted var(--accent-ink);margin:4px 0;min-height:22px}
.tl .rail svg{width:20px;height:20px;color:var(--accent-ink)}
.tl .stop .d{font-size:0.75rem;color:var(--muted)}
.tl .stop .t{font:600 1.375rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tl .stop .c{font-size:0.875rem}
.tl .stop+.stop{margin-top:6px}
.who{display:flex;flex-direction:column;gap:10px;min-width:0}
.who .p{display:flex;gap:10px;align-items:center;min-width:0}
.who .p div{min-width:0}
.who .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .s{font-size:0.75rem;color:var(--muted)}
.seats{display:flex;gap:3px;color:var(--muted)}
.seats svg{width:16px;height:16px}
.seats .taken{color:var(--line)}
.price{font:700 1.25rem var(--f-display);color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;font-variant-numeric:tabular-nums}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 1.0625rem var(--f-display);color:#fff}
.avatar.lg{width:104px;height:104px;font-size:2.375rem}
.avatar.sm{width:36px;height:36px;font-size:0.875rem}
.carpic{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--field);color:var(--muted)}
.carpic svg{width:26px;height:26px}
.stars{display:inline-flex;gap:1px;color:var(--star);vertical-align:-2px}
.stars svg{width:15px;height:15px}
.stars .off{color:var(--line)}
.banner{background:var(--warn-bg);border:1.5px solid var(--warn-line);border-radius:12px;padding:12px 14px;font-size:0.875rem;display:flex;gap:10px;align-items:center}
.kv{display:flex;flex-direction:column;gap:4px}
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:15px 16px;width:100%;text-align:left;font-size:0.9375rem}
.li+.li{border-top:1px solid var(--line)}
.li svg.ic{width:22px;height:22px;color:var(--accent-ink);flex:none}
.li .grow{flex:1;min-width:0}
.chev{color:var(--muted);width:18px;height:18px;flex:none}
.li.danger,.li.danger svg.ic{color:var(--danger)}
.section-title{font:700 0.8125rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
.hero-profile{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.hero-profile .avatar{background:rgba(255,255,255,.25)!important;border:2px solid rgba(255,255,255,.6)}
.hero-profile b{font:700 1.125rem var(--f-display);display:block}
.ratingbox{background:var(--accent-soft);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}
.ratingbox b{font:700 1.25rem var(--f-display);margin-right:6px}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:0.8125rem;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--field);overflow:hidden}
.bar i{display:block;height:100%;background:var(--star)}
.review+.review{border-top:1px solid var(--line);padding-top:12px}
.review p{margin:6px 0 0;font-size:0.875rem}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center}
.swatch.on{outline:2.5px solid var(--fg);outline-offset:2px}
.swatch svg{width:18px;height:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;color:var(--muted);background:var(--surface)}
.seg button.on{border-color:var(--accent-ink);color:var(--fg)}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty svg{width:48px;height:48px;color:var(--accent-ink);opacity:.7}
.notif{display:flex;gap:12px;align-items:flex-start}
.notif .ic{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.notif .ic svg{width:20px;height:20px}
.notif.unread{border-left:3px solid var(--accent)}
.pill{display:inline-block;font-size:0.6875rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);letter-spacing:.03em}
.pill.grey{background:var(--field);color:var(--muted)}
.pill.red{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.contact{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin:12px -16px -16px}
.contact a,.contact button{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;color:var(--accent-ink);text-decoration:none;font-weight:500}
.contact a+a,.contact a+button{border-left:1px solid var(--line)}
.contact svg{width:20px;height:20px}
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:500;font-size:0.875rem;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.stargrab{display:flex;gap:6px;justify-content:center;color:var(--star)}
.stargrab button svg{width:36px;height:36px}
.stargrab button.off{color:var(--line)}
.citylist{max-height:50vh;overflow:auto;display:flex;flex-direction:column}
.citylist button{text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.citylist svg{width:18px;height:18px;color:var(--accent-ink)}
.tag-demo{font-size:0.6875rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.lang{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:999px;padding:3px;font:700 0.75rem var(--f-display)}
.lang button{padding:6px 9px;border-radius:999px;color:var(--muted)}
.lang button.on{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:14px;padding:4px;gap:4px}
.mode button{min-height:44px;border-radius:11px;font:600 0.9375rem var(--f-display);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.mode button svg{width:20px!important;height:20px!important}
.mode button.on{background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow)}
.otp{font:700 1.875rem var(--f-display)!important;letter-spacing:.5em;text-align:center;padding-left:.5em!important}
.demo-code{background:var(--warn-bg);border:1.5px dashed var(--warn-line);border-radius:12px;padding:10px 14px;font-size:0.8125rem}
.demo-code b{font:700 1.125rem var(--f-display);letter-spacing:.15em}
.linkbtn{color:var(--accent-ink);font-weight:600;padding:6px 0}
.linkbtn:disabled{color:var(--muted);font-weight:500;cursor:default}
.uploads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.upl{position:relative;aspect-ratio:3/4;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center;font-size:0.7188rem;color:var(--muted);overflow:hidden;cursor:pointer}
.upl svg{width:26px;height:26px;color:var(--accent-ink)}
.upl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.upl .ok{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;z-index:1}
.upl .ok svg{width:14px;height:14px;color:inherit}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upl.has{border-style:solid;border-color:var(--accent-ink)}
.checkrow{display:flex;gap:10px;align-items:flex-start;font-size:0.8125rem;color:var(--muted);cursor:pointer}
.checkrow input{width:20px;height:20px;accent-color:var(--accent-ink);flex:none;margin:1px 0 0}
.badge-ok{display:inline-flex;align-items:center;gap:4px;font-size:0.75rem;font-weight:600;color:var(--accent-strong)}
.badge-ok svg{width:14px;height:14px}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sizes button{border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:0.75rem;color:var(--muted)}
.sizes button b{font-size:0.875rem;color:var(--fg)}
.sizes button.on{border-color:var(--accent-ink);background:var(--accent-soft)}
.parcel-row{display:flex;gap:12px;align-items:flex-start}
.parcel-row .bx{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.parcel-row .bx svg{width:22px;height:22px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.chip .cnt{font-size:0.6875rem;font-weight:700;margin-left:5px;opacity:.7}
.mode.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.mode.three button{font-size:0.875rem;gap:6px}
.filter-btn{min-height:46px;text-align:left;font-size:0.875rem}
.filter-btn small{display:block;font-size:0.6875rem;color:var(--muted);line-height:1.1}
.filter-btn b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.filter-btn>span{min-width:0;padding:6px 0}
.found{display:flex;justify-content:space-between;align-items:center;font-size:0.8125rem;color:var(--muted)}
.ordercard{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;text-align:left;width:100%;align-items:stretch}
.othumb{border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;overflow:hidden;min-height:88px}
.othumb svg{width:34px;height:34px}
.othumb img{width:100%;height:100%;object-fit:cover}
.obody{display:flex;flex-direction:column;gap:3px;min-width:0}
.otitle{font-size:0.9375rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sendcta{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:16px;padding:12px 14px;text-align:left;width:100%}
.sendcta .bx{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.sendcta .bx svg{width:24px;height:24px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}

/* ---- redesign overrides ---- */
.topbar{border-bottom:0;background:var(--bg)}
body::before{background:var(--bg)}
.topbar h1{font:600 0.9375rem/1.25 var(--f-display);letter-spacing:-.01em}
h2{font:600 1.25rem/1.3 var(--f-display);letter-spacing:-.01em}
h3{font:600 0.9375rem/1.35 var(--f-display)}
.card{border-radius:20px;box-shadow:none;border:1px solid var(--line)}
.list{border-radius:20px;box-shadow:none;border:1px solid var(--line)}
.field{border-radius:14px}
.btn{border-radius:16px;font:600 0.9375rem var(--f-display);letter-spacing:0;min-height:54px}
.btn.ghost{color:var(--fg);border:1.5px solid var(--line);background:var(--surface)}
.btn.ghost:hover{background:var(--field)}
.chip{background:var(--surface);border:1px solid var(--line)}
.chip.on{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.chip.on .cnt{color:var(--sel-ic)}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.mode button{border-radius:14px;font-weight:600}
.mode button.on{background:var(--sel-bg);color:var(--sel-fg);box-shadow:none}
.mode button.on svg{color:var(--sel-ic)}
.price{font:600 1rem var(--f-display);color:var(--on-accent);background:var(--accent);text-decoration:none;padding:5px 11px;border-radius:12px;white-space:nowrap}
.pill{color:var(--accent-ink)}
.badge-ok{color:var(--ok)}
.toggle.on{background:var(--sel-bg)}
.toggle.on::after{color:var(--sel-ic)}
.hero-profile{background:var(--ink);color:var(--on-ink);border-radius:24px}
.hero-profile .avatar{border-color:var(--accent)}
.sendcta{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:14px 16px}
.sendcta .muted{color:inherit;opacity:.72}
.sendcta .chev{color:var(--on-accent)}
.sendcta .bx{background:var(--ink);color:var(--accent)}
.swap{background:var(--ink);color:var(--accent);box-shadow:none}
.counter{border-radius:14px}
.ratingbox{background:var(--surface)}
.banner{border-radius:16px}
/* floating ink navigation */
.tabs{background:transparent;border:0;pointer-events:none;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs nav{pointer-events:auto;background:var(--ink);border-radius:26px;box-shadow:0 10px 30px rgba(10,14,22,.28);padding:4px;max-width:456px}
.tab{color:var(--ink-muted);border-radius:20px;padding:8px 2px}
.tab.on{color:var(--on-ink)}
.tab.on svg{color:var(--accent)}
.tab.fab span{display:none}
.tab.fab i{width:50px;height:50px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-2px;box-shadow:0 4px 14px rgba(255,194,26,.4)}
.tab.fab svg{width:28px;height:28px;color:var(--on-accent)!important}
.tab .dot{border:2px solid var(--ink)}
main{padding-bottom:124px}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
/* home greeting */
.hello{display:flex;flex-direction:column;gap:2px;margin-top:-4px}
.hello b{font:600 1.5rem/1.2 var(--f-display);letter-spacing:-.02em}
.hello span{color:var(--muted)}
/* horizontal trip card */
.trip2{display:flex;flex-direction:column;gap:14px;text-align:left;width:100%;padding:16px}
.tr-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.tr-pt{display:flex;flex-direction:column;min-width:0}
.tr-pt b{font:600 1.375rem/1.1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tr-pt span{font-size:0.8125rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.tr-pt.r{text-align:right;align-items:flex-end}
.tr-line{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:0.6875rem;color:var(--muted);min-width:0}
.tr-line .ln{position:relative;width:100%;height:12px;display:flex;align-items:center}
.tr-line .ln::before{content:"";flex:1;border-top:2px dashed var(--line)}
.tr-line .ln i{position:absolute;width:10px;height:10px;border-radius:50%;border:2.5px solid var(--fg);background:var(--surface)}
.tr-line .ln i:first-child{left:0}
.tr-line .ln i:last-child{right:0;background:var(--accent);border-color:var(--fg)}
.tr-line .ln em{position:absolute;left:50%;transform:translateX(-50%);background:var(--surface);padding:0 4px;color:var(--fg);display:flex}
.tr-line .ln em svg{width:18px;height:18px}
.tr-bot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.tr-bot .avatar{width:38px;height:38px;font-size:0.9375rem}
.tr-bot .who2{flex:1;min-width:0}
.tr-bot .who2>b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-bot .who2>span{font-size:0.75rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:0.75rem;color:var(--muted);margin-top:3px}
.tr-tags:empty{display:none}
.tr-tags .seats svg{width:15px;height:15px}
.ordercard{border-radius:20px}
.othumb{border-radius:14px;background:var(--accent-soft)}

/* ---- motion ---- */
@keyframes slideL{from{transform:translateX(28px);opacity:.01}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-28px);opacity:.01}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:.01}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes drive{from{left:8%}to{left:50%}}
@keyframes roadmove{to{transform:translateX(-48px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes toastIn{from{transform:translate(-50%,16px);opacity:0}}
@keyframes sheetOut{to{transform:translateY(40px);opacity:0}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#screen.nav-push>*{animation:slideL .32s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
#screen.nav-pop>*{animation:slideR .28s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*25ms)}
#screen.nav-tab>*{animation:rise .36s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}
.btn,.chip,.card,.mode button,.tab,.li,.swap,.sendcta,.icon-btn,.seg button,.sizes button,.swatch,.toggle{transition:transform .14s ease,background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease}
.btn:active,.chip:active,button.card:active,.mode button:active,.li:active,.sendcta:active,.seg button:active,.sizes button:active,.swatch:active{transform:scale(.97)}
.swap:active{transform:translateY(-50%) rotate(180deg) scale(.95)}
.swap{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.tab.on.pop svg{animation:pop .35s ease}
.tab.fab i{transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tab.fab:active i{transform:scale(.9)}
.tab.fab.on i svg{transform:rotate(45deg);transition:transform .3s}
.tab .dot.pop{animation:pop .4s ease}
.toast{animation:toastIn .28s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap{animation:fadeIn .2s ease}
.sheet-wrap.leaving{animation:fadeIn .2s ease reverse forwards;pointer-events:none}
.sheet-wrap.leaving .sheet{animation:sheetOut .2s ease forwards}
.trip2 .ln em{animation:drive .9s cubic-bezier(.2,.8,.2,1) both}
.sendcta{position:relative;overflow:hidden}
.sendcta::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 4.5s ease-in-out infinite;pointer-events:none}
.sendcta .bx svg{animation:bob 2.4s ease-in-out infinite}
.steps i.on{transform-origin:left;animation:grow .5s ease both}
.price{transition:transform .2s}
button.card:active .price{transform:scale(1.06)}
.shake{animation:shake .35s ease}
.road-strip{height:34px;border-radius:12px;background:rgba(255,255,255,.08);position:relative;overflow:hidden;width:100%}
.road-strip::before{content:"";position:absolute;left:0;right:-48px;top:50%;height:3px;margin-top:-1.5px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.7) 0 24px,transparent 24px 48px);animation:roadmove .6s linear infinite}
.road-strip span{position:absolute;z-index:1;left:18%;top:1px;width:28px;height:28px;color:var(--accent);animation:bob .5s ease-in-out infinite}
.road-strip span svg{width:28px;height:28px}
.celebrate{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .2s ease;pointer-events:none}
.celebrate.leaving{animation:fadeIn .25s ease reverse forwards}
.celebrate .box{display:flex;flex-direction:column;align-items:center;gap:12px;animation:pop .45s ease}
.celebrate .cel-check{width:92px;height:92px}
.celebrate .cel-check circle{fill:var(--accent);stroke:none}
.celebrate .cel-check path{fill:none;stroke:var(--on-accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .25s ease forwards}
.celebrate b{font:600 1.0625rem var(--f-display);text-align:center;max-width:260px}
@media (prefers-reduced-motion: reduce){.celebrate .cel-check path{stroke-dashoffset:0}#screen>*{opacity:1!important}}

.wallet-card{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--ink);color:var(--on-ink);border-radius:24px;padding:18px;position:relative;overflow:hidden}
.wallet-card::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--accent);opacity:.18}
.wc-l{font-size:0.8125rem;color:var(--ink-muted)}
.wc-top{font:600 0.8125rem var(--f-display);color:var(--on-accent);background:var(--accent);padding:6px 12px;border-radius:999px;position:relative}
.wc-b{font:600 2rem/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wc-b small{font-size:0.9375rem;color:var(--ink-muted);font-weight:500}
.wc-free{display:flex;flex-direction:column;gap:6px;font-size:0.7812rem;color:var(--ink-muted);margin-top:4px}
.wc-free b{color:var(--on-ink)}
.wc-free .bar{background:rgba(255,255,255,.14)}
.wc-free .bar i{background:var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.balchip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:0.8125rem;white-space:nowrap;flex:none}
.balchip svg{width:18px;height:18px;color:var(--accent-ink)}
.costbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--field);border-radius:14px;padding:12px 14px}
.costbox div{display:flex;flex-direction:column;gap:2px}
.costbox span{font-size:0.75rem;color:var(--muted)}
.costbox b{font:600 1.0625rem var(--f-display);font-variant-numeric:tabular-nums}
.costbox.free b:first-of-type{color:var(--ok)}
.limit-ic{width:64px;height:64px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto;animation:pop .45s ease}
.limit-ic svg{width:34px;height:34px}
.paymethods{display:flex;flex-direction:column;gap:6px}
.pm{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;text-align:left;font-weight:500;background:var(--surface);transition:border-color .2s,background-color .2s}
.pm i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;transition:border .2s}
.pm.on{border-color:var(--fg)}
.pm.on i{border:6px solid var(--accent-ink)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

body.in-chat main{padding-bottom:170px;gap:10px}
.chat-hint{text-align:center}
.chat-ctx{display:flex;gap:12px;align-items:center;padding:12px 14px}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{max-width:82%;padding:9px 12px 6px;border-radius:18px;font-size:0.9375rem;line-height:1.4;position:relative;animation:rise .25s ease both;overflow-wrap:anywhere}
.msg p{margin:0;white-space:pre-wrap}
.msg time{display:block;text-align:right;font-size:0.6562rem;opacity:.6;margin-top:2px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.msg.peer{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.sys{align-self:center;background:var(--field);color:var(--muted);font-size:0.75rem;padding:5px 12px;border-radius:999px;max-width:100%}
.msg.loc{min-width:220px}
.msg.loc .locic{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.msg.loc .locic svg{width:16px;height:16px}
.msg.loc p{margin:6px 0 2px;font-size:0.875rem}
.msg.typing{display:flex;gap:4px;padding:12px 14px}
.msg.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bob .9s ease-in-out infinite}
.msg.typing i:nth-child(2){animation-delay:.15s}.msg.typing i:nth-child(3){animation-delay:.3s}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.composer .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.composer .qr{margin:0 -12px;padding:0 12px}
.composer .qr .chip{font-size:0.8125rem;padding:7px 12px}
.sendbtn{width:46px;height:46px;border-radius:15px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;transition:transform .15s}
.sendbtn:active{transform:scale(.9)}
.sendbtn:disabled{opacity:.4}
.sendbtn svg{width:22px;height:22px}
.sup-av{width:42px;height:42px;border-radius:14px;background:var(--ink);color:var(--accent);display:grid;place-items:center;flex:none}
.sup-av svg{width:24px;height:24px}
.sup-av.sm{width:36px;height:36px;border-radius:12px}
.sup-av.sm svg{width:20px;height:20px}
.sup-av.lg{width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--on-accent)}
.sup-av.lg svg{width:30px;height:30px}
.sup-hero{display:flex;gap:14px;align-items:flex-start;background:var(--ink);color:var(--on-ink);border-radius:24px;padding:18px}
.sup-hero b{font:600 1.0625rem var(--f-display)}
.sup-hero p{margin:4px 0 0;color:var(--ink-muted);font-size:0.875rem}
.faq details{display:block}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:"+";font:600 1.125rem var(--f-display);color:var(--accent-ink);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:8px 0 0;color:var(--muted);font-size:0.875rem;animation:rise .25s ease}
.unread-dot{min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font-size:0.6875rem;display:grid;place-items:center;padding:0 6px}
.contact button{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;color:var(--accent-ink);font-weight:500;border-left:1px solid var(--line)}
.contact button svg{width:20px;height:20px}

.op-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.op-stats div{background:var(--ink);color:var(--on-ink);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.op-stats div:first-child{background:var(--accent);color:var(--on-accent)}
.op-stats b{font:600 1.5rem var(--f-display)}
.op-stats span{font-size:0.75rem;opacity:.75}
.op-actions{display:flex;gap:6px;flex-wrap:wrap}
.op-actions .chip{font-size:0.8125rem;padding:7px 12px;display:inline-flex;align-items:center;gap:5px}
.msg .who{display:block;font-size:0.7188rem;color:var(--accent-ink);margin-bottom:2px}

.eye{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:10px;margin-right:-6px}
.eye svg{width:20px;height:20px;color:inherit!important}
.eye.on{color:var(--accent-ink)}

.li{padding:14px 16px}

/* home: ride-app style header */
main:has(.home-hero){padding-top:0}
.home-hero{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:18px max(16px,env(safe-area-inset-left,0px)) 22px;background:linear-gradient(160deg,var(--ink),var(--ink2));border-radius:0 0 30px 30px;display:flex;flex-direction:column;gap:16px;color:var(--on-ink)}

/* trip card */

/* ---- design system: status colours, info banners, detail screens ---- */
.pill.st{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);font-size:0.7188rem;padding:4px 10px}

const inPlace = (value, filter) => !filter || value === filter || String(value).startsWith(filter + ', ');

// Search by Kyrgyz or Russian name; names that start with the query come first.
function searchPlaces(query, limit = 80) {
  const v = String(query).trim().toLowerCase();
  if (!v) return [];
  const hits = [];
  const seen = new Set();
  for (const group of PLACES) for (const label of group.items) {
    if (seen.has(label)) continue;
    const names = [label.toLowerCase(), (RU_NAMES[label] || "").toLowerCase()];
    if (names.some((n) => n.includes(v))) { seen.add(label); hits.push({ label, group, starts: names.some((n) => n.startsWith(v)) }); }
  }
  return hits.sort((a, b) => Number(b.starts) - Number(a.starts)).slice(0, limit);
}

function bindOtp(root,onOk,onChange){
  const inp=root.querySelector("#otpIn"), err=root.querySelector("#otpErr"), re=root.querySelector("#otpRe");
  const tick=()=>{ if(!document.body.contains(re)){ clearInterval(otp.timer); return; } const s=Math.ceil((otp.until-Date.now())/1000); if(s>0){ re.disabled=true; re.textContent=t("resendIn",{s}); } else { re.disabled=false; re.textContent=t("resend"); } };
  clearInterval(otp.timer); otp.timer=setInterval(tick,1000); tick();
  const check=()=>{ const v=inp.value.replace(/\D/g,""); if(v.length<4){ err.textContent=t("enterCode"); err.hidden=false; return; }
    if(v!==otp.code){ err.textContent=t("wrongCode"); err.hidden=false; inp.value=""; const fld=inp.closest(".field"); fld.classList.remove("shake"); void fld.offsetWidth; fld.classList.add("shake"); inp.focus(); return; }
    clearInterval(otp.timer); onOk(); };
  inp.oninput=()=>{ inp.value=inp.value.replace(/\D/g,"").slice(0,4); err.hidden=true; if(inp.value.length===4) check(); };
  root.querySelector("#otpOk").onclick=check;
  re.onclick=()=>{ sendCode(otp.phone); root.querySelector(".demo-code b").textContent=otp.code; toast(t("codeResent")); tick(); };
  root.querySelector("#otpChange").onclick=()=>{ clearInterval(otp.timer); onChange(); };
  setTimeout(()=>inp.focus(),60);
}

  els.forEach(el=>{ const m=el.textContent.match(/^(\d+)(.*)$/); if(!m) return; const n=+m[1], rest=m[2]; if(!n) return;
    const t0=performance.now(), d=650; const step=now=>{ const k=Math.min(1,(now-t0)/d), e=1-Math.pow(1-k,3); el.textContent=Math.round(n*e)+rest; if(k<1) requestAnimationFrame(step); }; el.textContent="0"+rest; requestAnimationFrame(step); });

// ---------- parcel orders (sender posts, any driver takes) ----------
const GEO = {"Бишкек":[42.87,74.59],"Кант":[42.89,74.85],"Токмок":[42.84,75.30],"Кемин":[42.78,75.69],"Балыкчы":[42.46,76.19],"Тамчы":[42.56,76.65],"Чолпон-Ата":[42.65,77.08],"Бостери":[42.65,77.25],"Каракол":[42.49,78.39],"Боконбаево":[42.12,76.99],"Кызыл-Суу":[42.34,78.00],"Жети-Өгүз":[42.36,78.23],"Кочкор":[42.21,75.75],"Нарын":[41.43,75.99],"Ат-Башы":[41.17,75.81],"Чаек":[41.93,74.51],"Казарман":[41.40,74.04],"Сокулук":[42.86,74.30],"Беловодское":[42.83,74.11],"Кара-Балта":[42.81,73.85],"Суусамыр":[42.18,73.95],"Талас":[42.52,72.24],"Токтогул":[41.87,72.94],"Кара-Көл":[41.62,72.67],"Таш-Көмүр":[41.35,72.22],"Кербен":[41.49,71.75],"Майлуу-Суу":[41.26,72.45],"Базар-Коргон":[41.04,72.75],"Жалал-Абад":[40.93,73.00],"Сузак":[40.90,72.90],"Кара-Суу":[40.70,72.87],"Өзгөн":[40.77,73.30],"Ош":[40.53,72.80],"Ноокат":[40.27,72.62],"Кызыл-Кыя":[40.26,72.13],"Баткен":[40.06,70.82],"Сүлүктү":[39.93,69.57]};
const ROADS = [["Бишкек","Кант"],["Кант","Токмок"],["Токмок","Кемин"],["Кемин","Балыкчы"],["Балыкчы","Тамчы"],["Тамчы","Чолпон-Ата"],["Чолпон-Ата","Бостери"],["Бостери","Каракол"],["Балыкчы","Боконбаево"],["Боконбаево","Кызыл-Суу"],["Кызыл-Суу","Жети-Өгүз"],["Жети-Өгүз","Каракол"],["Балыкчы","Кочкор"],["Кочкор","Нарын"],["Нарын","Ат-Башы"],["Кочкор","Чаек"],["Чаек","Казарман"],["Казарман","Жалал-Абад"],["Бишкек","Сокулук"],["Сокулук","Беловодское"],["Беловодское","Кара-Балта"],["Кара-Балта","Суусамыр"],["Суусамыр","Талас"],["Суусамыр","Токтогул"],["Токтогул","Кара-Көл"],["Кара-Көл","Таш-Көмүр"],["Таш-Көмүр","Кербен"],["Таш-Көмүр","Майлуу-Суу"],["Майлуу-Суу","Базар-Коргон"],["Базар-Коргон","Жалал-Абад"],["Жалал-Абад","Сузак"],["Сузак","Кара-Суу"],["Жалал-Абад","Өзгөн"],["Өзгөн","Кара-Суу"],["Кара-Суу","Ош"],["Ош","Ноокат"],["Ноокат","Кызыл-Кыя"],["Кызыл-Кыя","Баткен"],["Баткен","Сүлүктү"]];
const hav = (a,b) => { const R=6371, r=x=>x*Math.PI/180, dLa=r(b[0]-a[0]), dLo=r(b[1]-a[1]); const h=Math.sin(dLa/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
function roadPath(from,to){
  if(!GEO[from]||!GEO[to]) return null;
  const adj={}; ROADS.forEach(([a,b])=>{ (adj[a]=adj[a]||[]).push(b); (adj[b]=adj[b]||[]).push(a); });
  const dist={[from]:0}, prev={}, done=new Set();
  while(true){ let u=null; for(const k in dist) if(!done.has(k)&&(u===null||dist[k]<dist[u])) u=k; if(u===null) break; if(u===to) break; done.add(u);
    (adj[u]||[]).forEach(v=>{ const d=dist[u]+hav(GEO[u],GEO[v]); if(dist[v]===undefined||d<dist[v]){ dist[v]=d; prev[v]=u; } }); }
  if(dist[to]===undefined) return [from,to];
  const p=[to]; while(p[0]!==from) p.unshift(prev[p[0]]); return p;
}
const ROAD_K = 1.2;
const routeKm = (from,to) => { const p=roadPath(from,to); if(!p) return null; let s=0; for(let i=1;i<p.length;i++) s+=hav(GEO[p[i-1]],GEO[p[i]]); return Math.round(s*ROAD_K); };
const priceRange = (from,to) => { const km=routeKm(from,to); if(!km) return null; const a=Math.max(150,Math.round(km*0.7/50)*50); return [a, Math.round(a*1.8/50)*50]; };

// status flow; your own orders are taken by a demo driver automatically so tracking can be seen
const A_OPEN=8000, A_ACC=10000, TRIP_MS=150000;
function tickOrders(){
  let changed=false;
  (S.orders||[]).forEach(o=>{
    if(o.userId!=="me"||!o.auto||o.status==="cancelled"||o.status==="delivered") return;
    const e=Date.now()-o.createdAt;
    if(o.status==="open" && e>=A_OPEN){
      const cand=S.users.filter(u=>!userBlocked(u)&&S.trips.some(x=>x.driverId===u.id&&x.from===o.from&&x.to===o.to)); const d=(cand.length?cand:S.users)[Math.floor(Math.random()*(cand.length||S.users.length))];
      o.status="accepted"; o.driverId=d.id; o.acceptedAt=o.createdAt+A_OPEN; changed=true;
      if(o.fragile && !o.liability) o.liability={name:d.name,signedAt:o.acceptedAt,sig:"",worth:o.worth};
      notify("nAccepted",{driver:d.name,what:loc(o.what),phone:d.phone},"check",null,o.id);
    }
    if(o.status==="accepted" && e>=A_OPEN+A_ACC){ o.status="onway"; o.pickedAt=o.createdAt+A_OPEN+A_ACC; changed=true; notify("nOnway",{what:loc(o.what),to:o.to},"box",null,o.id); }
    if(o.status==="onway" && e>=A_OPEN+A_ACC+TRIP_MS){ o.status="delivered"; o.deliveredAt=Date.now(); changed=true; notify("deliveredNotif",{what:loc(o.what),to:o.to},"check",null,o.id); }
  });
  return changed;
}
const orderProgress = o => o.status==="delivered"?1 : o.status==="onway"? Math.min(o.auto?1:0.97,(Date.now()-o.pickedAt)/TRIP_MS) : 0;
const statusPill = o => `<span class="pill st st-${o.status}"><i></i>${t("ost_"+o.status)}</span>`;

function drawTrack(cv,o){
  const path=roadPath(o.from,o.to); if(!path){ cv.hidden=true; return null; }
  const pts=path.map(c=>GEO[c]);
  const cs=getComputedStyle(document.documentElement), col=n=>cs.getPropertyValue(n).trim();
  const W=cv.clientWidth||340, H=Math.round(W*0.62), dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  const k=Math.cos(41.5*Math.PI/180);
  let la=pts.map(p=>p[0]), lo=pts.map(p=>p[1]);
  let minLa=Math.min(...la)-0.3,maxLa=Math.max(...la)+0.3,minLo=Math.min(...lo)-0.4,maxLo=Math.max(...lo)+0.4;
  const cLa=(minLa+maxLa)/2,cLo=(minLo+maxLo)/2, sc=Math.min((W-36)/((maxLo-minLo)*k),(H-36)/(maxLa-minLa));
  const P=p=>[W/2+(p[1]-cLo)*k*sc, H/2-(p[0]-cLa)*sc];
  ctx.fillStyle=col("--field"); ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=col("--line"); ctx.lineWidth=1;
  for(let g=Math.floor(minLo);g<=maxLo;g+=0.5){ const [x]=P([0,g]); ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let g=Math.floor(minLa);g<=maxLa;g+=0.5){ const [,y]=P([g,0]); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.strokeStyle=col("--muted"); ctx.globalAlpha=.35; ctx.lineWidth=2.5; ctx.lineCap="round";
  ROADS.forEach(([a,b])=>{ const p1=P(GEO[a]),p2=P(GEO[b]); ctx.beginPath(); ctx.moveTo(...p1); ctx.lineTo(...p2); ctx.stroke(); });
  ctx.globalAlpha=1;
  // distances along route
  const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+hav(pts[i-1],pts[i]));
  const total=cum[cum.length-1], prog=orderProgress(o), done=total*prog;
  let seg=1; while(seg<pts.length-1 && cum[seg]<done) seg++;
  const f=(done-cum[seg-1])/((cum[seg]-cum[seg-1])||1);
  const car=[pts[seg-1][0]+(pts[seg][0]-pts[seg-1][0])*f, pts[seg-1][1]+(pts[seg][1]-pts[seg-1][1])*f];
  // remaining route (dashed) and travelled part (solid)
  ctx.strokeStyle=col("--fg"); ctx.lineWidth=3; ctx.setLineDash([7,7]);
  ctx.beginPath(); ctx.moveTo(...P(car)); for(let i=seg;i<pts.length;i++) ctx.lineTo(...P(pts[i])); ctx.stroke();
  ctx.setLineDash([]); ctx.lineWidth=5; ctx.strokeStyle=col(o.status==="delivered"?"--ok":"--st-onway");
  ctx.beginPath(); ctx.moveTo(...P(pts[0])); for(let i=1;i<seg;i++) ctx.lineTo(...P(pts[i])); ctx.lineTo(...P(car)); ctx.stroke();
  // city dots + labels on route
  ctx.font="600 11px Inter, system-ui, sans-serif"; ctx.textBaseline="middle";
  path.forEach((c,i)=>{ const [x,y]=P(GEO[c]); const end=i===0||i===path.length-1;
    ctx.fillStyle=end?col("--accent"):col("--surface"); ctx.strokeStyle=col("--fg"); ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,end?6:4,0,7); ctx.fill(); ctx.stroke();
    if(end||path.length<=6||i%2===0){ ctx.fillStyle=col("--fg"); ctx.font=(end?"700 12px":"500 10.5px")+" Inter, system-ui, sans-serif";
      const tw=ctx.measureText(c).width; let tx=x+9; if(tx+tw>W-4) tx=x-9-tw; ctx.fillText(c,tx,y); } });
  // car marker
  const [cx,cy]=P(car);
  ctx.fillStyle=col("--accent"); ctx.globalAlpha=.22; ctx.beginPath(); ctx.arc(cx,cy,16+4*Math.sin(Date.now()/400),0,7); ctx.fill(); ctx.globalAlpha=1;
  ctx.beginPath(); ctx.arc(cx,cy,11,0,7); ctx.fill(); ctx.strokeStyle=col("--ink"); ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle=col("--ink"); ctx.fillRect(cx-5,cy-2,10,5); ctx.fillRect(cx-3,cy-5,6,4);
  const passed = path[Math.max(0,seg-1)];
  return {remaining:Math.round((total-done)*ROAD_K), passed, prog};
}
function trackInfo(o,info){
  if(!info) return "";
  if(o.status==="accepted") return `<b>${t("pickupSoon")}</b>`;
  if(o.status==="delivered") return `<b style="color:var(--accent-ink)">${t("ost_delivered")}</b>`;
  const h=Math.floor(info.remaining/65), m=Math.round((info.remaining/65-h)*60);
  return `<b>${info.prog<0.02?t("atStart",{city:o.from}):t("passed",{city:info.passed})}</b><br><span class="muted">${t("leftKm",{to:o.to,km:info.remaining})} · ${t("eta",{h,m})}</span>`;
}
let trkRaf=0, trkLast=0;
function trackLoop(ts){ const cv=document.getElementById("trkMap"); if(!cv){ trkRaf=0; return; } if(ts-trkLast>60){ trkLast=ts; updateTracking(true); } trkRaf=requestAnimationFrame(trackLoop); }
function updateTracking(fromLoop){
  if(!fromLoop && !trkRaf && document.getElementById("trkMap") && !matchMedia("(prefers-reduced-motion: reduce)").matches) trkRaf=requestAnimationFrame(trackLoop);
  const cv=document.getElementById("trkMap"); if(!cv) return;
  const o=(S.orders||[]).find(x=>x.id===cv.dataset.id); if(!o) return;
  const info=drawTrack(cv,o); const el=document.getElementById("trkInfo"); if(el) el.innerHTML=trackInfo(o,info);
}

// ---------- chat + support ----------
// Demo: the other side (driver, sender, support agent) answers automatically.
function threads(){ return S.threads = S.threads || {}; }
function getThread(kind, ref, peer, extra={}){
  const id=kind+":"+ref, T=threads();
  if(!T[id]) T[id]={id,kind,ref,peer,msgs:[],unread:0,createdAt:Date.now(),lastAt:Date.now(),...extra};
  return T[id];
}
function routeState(o){
  const path=roadPath(o.from,o.to); if(!path) return null;
  const pts=path.map(c=>GEO[c]); const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+hav(pts[i-1],pts[i]));
  const total=cum[cum.length-1], prog=orderProgress(o), done=total*prog; let seg=1; while(seg<pts.length-1&&cum[seg]<done) seg++;
  const remaining=Math.round((total-done)*ROAD_K), hrs=remaining/65, h=Math.floor(hrs), m=Math.round((hrs-h)*60);
  return {passed:path[Math.max(0,seg-1)], remaining, h, m, prog};
}
const hhmm = ts => new Date(ts).toLocaleTimeString(S.lang==="ky"?"ky-KG":"ru-RU",{hour:"2-digit",minute:"2-digit"});
function msgsHtml(th){
  return th.msgs.map(m=> m.from==="sys" ? `<div class="msg sys">${esc(m.text)}</div>`
    : m.type==="loc" ? `<div class="msg peer loc"><div class="row" style="gap:8px"><span class="locic">${I.pin}</span><b>${t("locCard")}</b></div><p>${esc(m.text)}</p><button class="linkbtn" data-goorder="${esc(th.ref)}">${t("openMap")} →</button><time>${hhmm(m.at)}</time></div>`
    : `<div class="msg ${m.from}"><p>${esc(m.text)}</p><time>${hhmm(m.at)}</time></div>`).join("")
    + (th.typing?`<div class="msg peer typing" aria-label="${t("typing")}"><i></i><i></i><i></i></div>`:"");
}
function refreshChat(th){
  const box=document.getElementById("msgs");
  if(box && box.dataset.id===th.id){ th.unread=0; if(th.kind==="support"){ const sb=document.querySelector("#topbar .sub"); if(sb) sb.textContent=t("tk_"+(th.status||"open")); } box.innerHTML=msgsHtml(th); bindMsgs(box); window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); return true; }
  return false;
}
function bindMsgs(box){ box.querySelectorAll("[data-goorder]").forEach(b=>b.onclick=()=>go("order",{id:b.dataset.goorder})); }
function pushMsg(th, from, text, type="text"){
  th.msgs.push({id:uid(),from,text,type,at:Date.now()}); th.lastAt=Date.now();
  if(from==="peer" && !refreshChat(th)){ th.unread=(th.unread||0)+1; notify("nMsg",{name:th.peer,text:text.length>60?text.slice(0,60)+"…":text},"chat",null,null,th.id); renderTabs(); }
  else refreshChat(th);
  save();
}
function botReplies(th, text){
  const q=text.toLowerCase(), has=(...w)=>w.some(x=>q.includes(x));
  if(th.kind==="support") return supportReply(th, text);
  if(th.kind==="trip"){
    if(has("орун","мест","свобод")) return [[t("b_seat")]];
    if(has("жолуг","встреч","кайда","где")) return [[t("b_meet")]];
    if(has("рахмат","спасибо")) return [[t("b_thanks")]];
    return [[t("b_ok")]];
  }
  const o=(S.orders||[]).find(x=>x.id===th.ref); if(!o) return [[t("b_ok")]];
  if(o.driverId==="me") return [[has("рахмат","спасибо")?t("b_thanks"):t("b_sender")]];
  if(o.status==="accepted") return [[t("b_coming")]];
  if(o.status==="delivered") return [[t("b_done")]];
  const r=routeState(o);
  if(has("кайда","где","жетт","жетип","турасыз","едете","находит")) return r?[[t("b_loc",{city:r.passed,to:o.to,km:r.remaining,h:r.h,m:r.m})],[`${r.passed} → ${o.to}: ${r.remaining} км`,"loc"]]:[[t("b_ok")]];
  if(has("качан","когда","убакыт","саат","скоро")) return r?[[t("b_eta",{to:o.to,h:r.h,m:r.m})]]:[[t("b_ok")]];
  if(has("чал","позвон","звон")) return [[t("b_call")]];
  if(has("рахмат","спасибо")) return [[t("b_thanks")]];
  return [[t("b_ok")]];
}

function scheduleReplies(th, replies, delay=1300){
  if(!replies.length) return;
  th.typing=true; refreshChat(th);
  setTimeout(()=>{ th.typing=false; const [text,type]=replies.shift(); pushMsg(th,"peer",text,type||"text"); if(replies.length) setTimeout(()=>scheduleReplies(th,replies,900),300); }, delay+Math.random()*700);
}
function sendMsg(th, text){
  text=text.trim(); if(!text) return;

  scheduleReplies(th, botReplies(th,text));
}

function blacklist(){ return S.blacklist = S.blacklist || [
  {id:"b1",name:"Алымбек Т.",phone:"+996 700 13 13 13",pin:"21503198700123",doc:"",phones:[],reason:{ru:"Не доставил посылку, пропал с товаром",ky:"Посылканы жеткирбей, товар менен жоголду"},at:Date.now()-20*864e5,by:"admin"},
  {id:"b2",name:"Жоомарт С.",phone:"+996 555 66 60 66",pin:"",doc:"ID1234567",phones:[],reason:{ru:"Поддельные документы",ky:"Жасалма документтер"},at:Date.now()-5*864e5,by:"admin"}]; }
function blHit({phone,pin,doc}={}){
  const p=digits(phone), n=digits(pin), d=normDoc(doc);
  return blacklist().find(b=>(p&&(digits(b.phone)===p||(b.phones||[]).some(x=>digits(x)===p)))||(n&&b.pin&&digits(b.pin)===n)||(d&&b.doc&&normDoc(b.doc)===d))||null;
}
function meBlocked(){ if(!S.me) return null; const ps=S.me.driver?.passport||{}; return blHit({phone:S.me.phone,pin:ps.pin,doc:ps.num}); }
const userBlocked = u => !!u && (!!u.blocked || !!blHit({phone:u.phone}));
function addToBlacklist(e){
  const hit=blHit(e);
  if(hit){ ["name","phone","pin","doc"].forEach(k=>{ if(!hit[k]&&e[k]) hit[k]=e[k]; }); if(e.phone&&digits(e.phone)!==digits(hit.phone)) hit.phones=[...new Set([...(hit.phones||[]),e.phone])]; return hit; }
  const x={id:uid(),phones:[],at:Date.now(),by:opMe()?.login||"admin",...e}; blacklist().unshift(x); return x;
}

function contractSheet(o, onSigned){
  const ps=S.me.driver?.passport||{};
  const full=[ps.surname,ps.first,ps.patr].filter(Boolean).join(" ")||S.me.name;
  sheet(`${contractBody(o,full)}
    <span class="lbl">${t("lbSignHere")}</span>
    <div class="sigpad"><canvas id="sigCv" aria-label="${t("lbSignHere")}"></canvas><button type="button" class="linkbtn" id="sigClr">${t("lbClear")}</button></div>
    <div class="field">${I.user}<input id="sigName" maxlength="60" placeholder="${t("lbFullName")}" value="${esc(full)}"></div>
    <label class="agree"><input type="checkbox" id="sigOk"><span>${t("lbAgree")}</span></label>
    <button class="btn" id="sigGo">${t("lbSignBtn")}</button><button class="btn ghost" id="cNo">${t("back")}</button>`, el=>{
    const cv=el.querySelector("#sigCv"), dpr=window.devicePixelRatio||1;
    const W=cv.clientWidth||320, H=150; cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
    const c=cv.getContext("2d"); c.scale(dpr,dpr); c.lineWidth=2.4; c.lineCap="round"; c.lineJoin="round"; c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--fg").trim()||"#111";
    let drawing=false, ink=0, last=null;
    const pt=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
    cv.onpointerdown=e=>{ drawing=true; last=pt(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); };
    cv.onpointermove=e=>{ if(!drawing) return; const p=pt(e); c.beginPath(); c.moveTo(...last); c.lineTo(...p); c.stroke(); ink+=Math.hypot(p[0]-last[0],p[1]-last[1]); last=p; };
    cv.onpointerup=cv.onpointercancel=()=>{ drawing=false; };
    el.querySelector("#sigClr").onclick=()=>{ c.clearRect(0,0,W,H); ink=0; };
    el.querySelector("#cNo").onclick=closeSheet;
    el.querySelector("#sigGo").onclick=()=>{
      const name=el.querySelector("#sigName").value.trim();
      if(ink<30){ toast(t("lbNeedSign")); return; }
      if(name.length<4){ toast(t("lbNeedName")); return; }
      if(!el.querySelector("#sigOk").checked){ toast(t("lbAgree")); return; }
      const liab={name,signedAt:Date.now(),sig:cv.toDataURL("image/png"),worth:o.worth,pin:ps.pin||""};
      closeSheet(); toast(t("lbSigned")); setTimeout(()=>onSigned(liab),250);
    };
  });
}

  const W=(ru,ky)=>({ru,ky}), H=3600e3, now=Date.now();

function mountSig(cv, clr){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||320, H=140;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
  const c=cv.getContext("2d"); c.scale(dpr,dpr); c.lineWidth=2.4; c.lineCap="round"; c.lineJoin="round"; c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--fg").trim()||"#111";
  const st={ink:0}; let drawing=false, last=null;
  const pt=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  cv.onpointerdown=e=>{ drawing=true; last=pt(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); };
  cv.onpointermove=e=>{ if(!drawing) return; const p=pt(e); c.beginPath(); c.moveTo(...last); c.lineTo(...p); c.stroke(); st.ink+=Math.hypot(p[0]-last[0],p[1]-last[1]); last=p; };
  cv.onpointerup=cv.onpointercancel=()=>{ drawing=false; };
  if(clr) clr.onclick=()=>{ c.clearRect(0,0,W,H); st.ink=0; };
  st.data=()=>cv.toDataURL("image/png");
  return st;
}

async function hashPw(pw, salt){
  const data=new TextEncoder().encode(salt+":"+pw);
  try{ const buf=await crypto.subtle.digest("SHA-256",data); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(const b of data) h=((h<<5)+h+b)>>>0; return "x"+h.toString(16); }
}

// ---------- free limit + wallet ----------
// Change these to set the business rules.
const FREE_LIMIT = 5;                         // free actions for every new user
const FEES = {trip:30, order:20, take:30};    // price per action after the limit, сом
const TOPUPS = [100,200,500,1000];
const PAY_METHODS = ["Мбанк","О!Деньги","Элсом","Bakai","Элкарт / Visa"];
function wallet(){ const m=S.me; m.wallet=m.wallet||{balance:0,used:0,tx:[]}; return m.wallet; }
const freeLeft = () => Math.max(0, FREE_LIMIT - wallet().used);
function charge(kind, details, okLabel, onOk, title, opts={}){
  const w=wallet(), fee=FEES[kind], free=freeLeft();
  if(!free && w.balance<fee){
    sheet(`<div class="limit-ic">${I.wallet}</div><h3 style="text-align:center">${t("limitOver")}</h3>
      <p class="muted" style="margin:0;text-align:center">${t("limitOverText",{n:FREE_LIMIT})}</p>
      <div class="costbox"><div><span>${t("costLbl")}</span><b>${fee} с</b></div><div><span>${t("balanceLbl")}</span><b>${w.balance} с</b></div></div>
      <button class="btn" id="goTop">${t("topUp")}</button><button class="btn ghost" id="cNo">${t("back")}</button>`, el=>{
      el.querySelector("#goTop").onclick=()=>{ closeSheet(); go("wallet",{need:fee-w.balance}); };
      el.querySelector("#cNo").onclick=closeSheet;
    });
    return;
  }
  const costLine = free
    ? `<div class="costbox free"><div><span>${t("costLbl")}</span><b>${t("freeWord")}</b></div><div><span>${t("freeLeftLbl")}</span><b>${free-1} / ${FREE_LIMIT}</b></div></div>`
    : `<div class="costbox"><div><span>${t("costLbl")}</span><b>${fee} с</b></div><div><span>${t("balanceAfter")}</span><b>${w.balance-fee} с</b></div></div>`;
  sheet(`<h3>${esc(title||t("confirmAction"))}</h3>${opts.html||""}<p class="muted" style="margin:0">${esc(details)}</p>${costLine}
    ${opts.agree?`<label class="agree"><input type="checkbox" id="cAgree"><span>${esc(opts.agree)}</span></label>`:""}
    <button class="btn" id="cOk" ${opts.agree?"disabled":""}>${esc(okLabel)}${free?"":` · ${fee} с`}</button><button class="btn ghost" id="cNo">${t("back")}</button>`, el=>{
    const ag=el.querySelector("#cAgree"); if(ag) ag.onchange=()=>{ el.querySelector("#cOk").disabled=!ag.checked; };
    el.querySelector("#cOk").onclick=()=>{
      if(ag && !ag.checked) return;
      if(free){ w.used++; w.tx.unshift({id:uid(),type:"free",kind,amount:0,at:Date.now()}); }
      else { w.balance-=fee; w.tx.unshift({id:uid(),type:"fee",kind,amount:-fee,at:Date.now()}); }
      closeSheet(); onOk();
    };
    el.querySelector("#cNo").onclick=closeSheet;
  });
}
function walletCard(compact){
  const w=wallet(), left=freeLeft();
  return `<button class="wallet-card" id="walletCard" aria-label="${t("walletTitle")}">
    <div class="row between"><span class="wc-l">${t("balanceLbl")}</span><span class="wc-top">${t("topUp")} +</span></div>
    <b class="wc-b">${w.balance} <small>сом</small></b>
    <div class="wc-free"><span>${t("freeLeftLbl")}: <b>${left} / ${FREE_LIMIT}</b></span><div class="bar"><i style="width:${left/FREE_LIMIT*100}%"></i></div></div>
  </button>`;
}

    setTimeout(()=>{
      w.balance+=n; w.tx.unshift({id:uid(),type:"topup",amount:n,method:st.method,at:Date.now()});

      celebrate(t("topupDone",{n}));
      screens.wallet.seen=false;
      if(need && stack.length>1) back(); else render();
    },1300);
  };

function readPhoto(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
      const max=560, k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.6)); };
      img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

      <div class="switch" style="color:var(--fg)"><span class="row" style="gap:10px"><span class="parcel-row"><span class="bx">${I.box}</span></span><span><b>${t("takeParcels")}</b><br><span class="small muted">${t("takeParcelsNote")}</span></span></span><button type="button" class="toggle ${c.parcel?"on":""}" id="cParcel" role="switch" aria-checked="${c.parcel}" data-label="${c.parcel?t("yes"):t("no")}"><i></i></button></div>
      ${c.parcel?`<label class="lbl" for="cPP">${t("parcelPriceLbl")}</label><label class="field" for="cPP">${I.wallet}<input type="number" id="cPP" inputmode="numeric" min="0" step="10" placeholder="200" value="${c.parcelPrice}"></label>`:""}
    </div>
    <label class="lbl" for="cPay">${t("payLbl")}</label>
    <label class="field" for="cPay">${I.wallet}<select id="cPay">${["cash","transfer","both"].map(p=>`<option value="${p}" ${p===c.payment?"selected":""}>${t("pay_"+p)}</option>`).join("")}</select></label>
    <label class="lbl" for="cCom">${t("details")}</label>
    <div class="field"><textarea id="cCom" maxlength="300" placeholder="${t("detailsPh")}">${esc(c.comment)}</textarea></div>
    <div class="card row"><div class="carpic">${I.car}</div><div style="flex:1"><b style="font-weight:500">${carTxt(me.car)}</b><div class="small muted">${t("c_"+me.car.color)}</div></div><button type="button" class="pill" id="chCar">${t("change")}</button></div>
    <button class="btn" type="submit">${t("publish")}</button>
  </form>`;
  const keep=()=>{ c.date=$("#cDate").value; c.dep=$("#cDep").value; c.arr=$("#cArr").value; c.price=$("#cPrice").value; c.payment=$("#cPay").value; c.comment=$("#cCom").value; if($("#cPP")) c.parcelPrice=$("#cPP").value; };
  $("#cFrom").onclick=()=>{keep();citySheet(c.from,x=>{c.from=x;render();});};
  $("#cTo").onclick=()=>{keep();citySheet(c.to,x=>{c.to=x;render();});};
  $("#cSwap").onclick=()=>{keep();[c.from,c.to]=[c.to,c.from];render();};
  $("#sm").onclick=()=>{c.seats=Math.max(1,c.seats-1);$("#sn").textContent=c.seats;};
  $("#sp").onclick=()=>{c.seats=Math.min(8,c.seats+1);$("#sn").textContent=c.seats;};
  $("#cParcel").onclick=()=>{keep();c.parcel=!c.parcel;render();};
  $("#chCar").onclick=()=>{keep();go("car");};
  $("#cf").onsubmit=e=>{ e.preventDefault(); keep();
    if(!c.from||!c.to){ toast(t("bothCities")); return; }
    if(c.from===c.to){ toast(t("citiesDiffer")); return; }
    if(!c.date||!c.dep){ toast(t("needDateTime")); return; }
    if((c.date+"T"+c.dep) < NOW()){ toast(t("timePassed")); return; }
    const price=parseInt(c.price,10); if(!(price>=0)){ toast(t("needPrice")); return; }
    const pp=parseInt(c.parcelPrice,10); if(c.parcel && !(pp>=0)){ toast(t("needParcelPrice")); return; }
    charge("trip",t("chargeTripText",{from:c.from,to:c.to,date:dShort(c.date),time:c.dep}),t("publish"),()=>{
    const tr={id:"t"+uid(),driverId:"me",from:c.from,to:c.to,date:c.date,dep:c.dep,arr:c.arr,price,seats:c.seats,booked:[],payment:c.payment,parcel:c.parcel,parcelPrice:c.parcel?pp:0,parcels:[],comment:c.comment.trim()};
    S.trips.push(tr);
    notify("publishedNotif",{from:tr.from,to:tr.to,date:tr.date,time:tr.dep},"check",tr.id);
    Object.assign(draft,{to:"",price:"",comment:"",arr:"",parcelPrice:""});
    celebrate(t("published"));
    stack=[]; tab="trips"; go("trip",{id:tr.id});
    });
  };
};

screens.notifs = () => {
  topbar(t("notifsTitle"),{right:S.notifs.length?`<button class="icon-btn" id="clr" aria-label="${t("clear")}">${I.trash.replace('class="ic"','width="22" height="22"')}</button>`:""});
  const ago = ts => { const m=Math.round((Date.now()-ts)/60000); if(m<1) return t("justNow"); if(m<60) return t("minAgo",{n:m}); const h=Math.round(m/60); if(h<24) return t("hAgo",{n:h}); return new Date(ts).toLocaleDateString(S.lang==="ky"?"ky-KG":"ru-RU"); };
  $("#screen").innerHTML = S.notifs.length? S.notifs.map(n=>`<button class="card notif ${n.read?"":"unread"}" style="text-align:left;width:100%" ${n.tripId?`data-nt="${n.tripId}"`:""} ${n.orderId?`data-no="${n.orderId}"`:""} ${n.chatId?`data-nc="${esc(n.chatId)}"`:""}><span class="ic ic-${n.icon}">${I[n.icon]||I.bell}</span><div style="flex:1;min-width:0"><div>${esc(notifText(n))}</div><div class="small muted">${ago(n.at)}</div></div></button>`).join("")
    : `<div class="card empty">${I.bell}<h3 style="margin-top:8px">${t("quiet")}</h3><p>${t("quietText")}</p></div>`;
  S.notifs.forEach(n=>n.read=true); save(); renderTabs();
  document.querySelectorAll("[data-nt]").forEach(b=>b.onclick=()=>{ if(S.trips.some(x=>x.id===b.dataset.nt)) go("trip",{id:b.dataset.nt}); else toast(t("tripGone")); });
  document.querySelectorAll("[data-nc]").forEach(b=>b.onclick=()=>{ if(threads()[b.dataset.nc]) go("chat",{id:b.dataset.nc}); });
  document.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>{ if((S.orders||[]).some(o=>o.id===b.dataset.no)) go("order",{id:b.dataset.no}); else toast(t("tripGone")); });

};

function phoneSheet(){
  const me=S.me;
  sheet(`<h3>${t("newPhone")}</h3><div class="field">${I.phone}<input id="np" inputmode="tel" value="+996 " aria-label="${t("newPhone")}"></div><button class="btn" id="ok">${t("getCode")}</button>`,el=>{
    el.querySelector("#ok").onclick=()=>{ const v=el.querySelector("#np").value.trim(); if(!validPhone(v)){toast(t("checkPhone"));return;}
      sendCode(fmtPhone(v));
      sheet(`<h2 class="h3">${t("codeTitle")}</h2>${otpBlock()}`, el2=>bindOtp(el2,()=>{ me.phone=otp.phone; S.trips.forEach(x=>x.booked.forEach(b=>{ if(b.userId==="me") b.phone=otp.phone; })); closeSheet(); toast(t("phoneUpdated")); render(); }, phoneSheet));
    };
  });
}

  const me=S.me; topbar(t("nameAgeGender"),{canBack:true});

  $("#screen").innerHTML=`<form class="stack" id="nf" novalidate>
    <label class="lbl" for="nN">${t("name")}</label><div class="field">${I.user}<input id="nN" maxlength="30" value="${esc(me.name)}"></div>
    <label class="lbl" for="nA">${t("age")}</label><div class="field">${I.hash}<input id="nA" type="number" min="16" max="99" inputmode="numeric" value="${esc(me.age)}" placeholder="${t("agePh")}"></div>
    <span class="lbl">${t("gender")}</span><div class="seg"><button type="button" data-g="m" class="${g==="m"?"on":""}">${t("maleBtn")}</button><button type="button" data-g="f" class="${g==="f"?"on":""}">${t("femaleBtn")}</button></div>
    <button class="btn" type="submit">${t("save")}</button></form>`;
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{g=b.dataset.g;document.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("on",x===b));});

    S.trips.forEach(x=>{ x.booked.forEach(b=>{ if(b.userId==="me") b.name=n; }); (x.parcels||[]).forEach(p=>{ if(p.userId==="me") p.sender=n; }); });

    <button class="btn" type="submit">${me.car?t("save"):t("add")}</button>

  </form>`;
  const keep=()=>{ c.brand=$("#cb").value; c.model=$("#cm").value; c.year=$("#cy").value; c.plate=$("#cpl").value.toUpperCase(); };
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{keep();c.wheel=b.dataset.w;draw();});
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{keep();c.kind=b.dataset.k;draw();});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{keep();c.color=b.dataset.c;draw();});
  $("#carf").onsubmit=e=>{e.preventDefault(); keep(); if(!c.brand.trim()||!c.model.trim()){toast(t("needBrand"));return;}
    me.car={kind:c.kind,brand:c.brand.trim(),model:c.model.trim(),year:c.year?+c.year:"",plate:c.plate.trim(),wheel:c.wheel,color:c.color};
    toast(t("carSaved")); back(); };
  const rm=$("#rmCar"); if(rm) rm.onclick=()=>confirmSheet(t("removeCarQ"),t("removeCarText"),t("del"),()=>{me.car=null;back();});
  };
  draw();
};

checkVerification(); if(!ADMIN) tickOrders();
// keep the two pages in step: the other tab saved, so take its data and redraw
addEventListener("storage",e=>{ if(e.key!==KEY||!e.newValue) return; try{ S=JSON.parse(e.newValue); }catch(_){ return; }
  if(document.activeElement?.matches("input,textarea,select")||$("#overlay").innerHTML){ if(!ADMIN&&S.me) renderTabs(); else if(ADMIN) adminNav(); return; }
  render(); });
(function splash(){
  try{ if(sessionStorage.getItem("jsplash")) return; sessionStorage.setItem("jsplash","1"); }catch(e){ return; }
  if(ADMIN || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const el=document.createElement("div"); el.className="splash"; el.setAttribute("aria-hidden","true");
  el.innerHTML=`<div class="sp-in"><span class="sp-logo">${I.road}</span><b>Жолдош</b><div class="sp-road"><i></i><span>${I.car}</span></div></div>`;
  document.body.appendChild(el);
  const go=()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),380); };
  el.onclick=go; setTimeout(go,1500);
})();
render();
})();
</script>
